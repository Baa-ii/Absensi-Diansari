<style>
/* Layout: sticky top bar (brand, search, tools) + horizontal main menu, breadcrumb, left section panel, content column */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#17201E; --muted:#66726E; --line:#E2E7E4; --hover:#EFF3F1;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#151D1A; --ink:#E7EEEB; --muted:#92A09A; --line:#25302C; --hover:#1B2522;
  --accent:#5FBBA6; --accent-ink:#0A1411; --accent-soft:#1A2E29;
  --good:#5CC393; --good-soft:#173126; --warn:#DDAA45; --warn-soft:#352B14; --bad:#EC8570; --bad-soft:#38201B;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#151D1A; --ink:#E7EEEB; --muted:#92A09A; --line:#25302C; --hover:#1B2522;
  --accent:#5FBBA6; --accent-ink:#0A1411; --accent-soft:#1A2E29;
  --good:#5CC393; --good-soft:#173126; --warn:#DDAA45; --warn-soft:#352B14; --bad:#EC8570; --bad-soft:#38201B;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 4px 16px rgba(20,32,28,.07);margin-bottom:12px}

.sr{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;z-index:50}

.pad{padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px}

table{border-collapse:collapse;width:100%}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--hover)}
td.n,th.n{text-align:right}
td.dim{color:var(--muted)} tr.off td{background:var(--hover);color:var(--muted)}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--hover);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.lnk{background:none;border:0;padding:0;font-weight:700;cursor:pointer;text-align:left;color:var(--ink)} .lnk:hover{color:var(--accent);text-decoration:underline}
.sw{position:relative;display:inline-block;width:36px;height:20px;vertical-align:middle}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked+i{background:var(--accent)} .sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.pager.top{border-top:0;border-bottom:1px solid var(--line)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:30px 18px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface);display:block}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop b{display:block;color:var(--ink);font-size:15px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{font-weight:400;color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;position:relative;margin:6px 0 0}
.bars .g{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.bars .g span{position:absolute;right:0;top:-17px;font-size:11px;color:var(--muted);font-family:var(--num)}
.bar{flex:1;min-width:0;background:var(--accent);border-radius:4px 4px 0 0;position:relative;opacity:.85}
.bar.last{opacity:1}
.bar span{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--num)}
.over-ov{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:70;display:flex;justify-content:center;align-items:flex-start;padding:5vh 16px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(640px,100%);padding:22px;display:flex;flex-direction:column;gap:16px}
.modal h1,.drawer h1{font-size:19px;margin:0}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(900px,100%);background:var(--surface);box-shadow:var(--shadow);z-index:70;overflow:auto;padding:22px;padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.pick{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.pick label{display:flex;gap:10px;align-items:center;padding:6px 12px;border-top:1px solid var(--line);cursor:pointer}
.pick label:first-child{border-top:0} .pick label:hover{background:var(--hover)}
.letter{border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;z-index:90}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.muted{color:var(--muted)}
.bulk{background:var(--accent-soft);padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.issues{margin:0;padding-left:18px;color:var(--warn)}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;flex-direction:row;overflow-x:auto}
  .ent{display:none}
  .sl{display:flex;padding:6px;gap:4px} .sl h2{display:none}
  .sl a{border:0;border-radius:8px;white-space:nowrap}
  .bar1{grid-template-columns:1fr auto} .search{grid-column:1/-1;order:3}
  .user span{display:none}
  .stat{border-left:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const toMin=t=>{if(!t)return null;const p=t.split(':');return +p[0]*60+ +p[1]};
const fromMin=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
const dayNum=s=>{const p=s.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/86400000)};
const numDate=n=>{const d=new Date(n*86400000);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const HARI=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=ds=>{const d=pd(ds);return HARI[d.getDay()]+', '+d.getDate()+' '+BULAN[d.getMonth()].slice(0,3)+' '+d.getFullYear()};
const fmtH=m=>m?(m/60).toFixed(1).replace('.',','):'0';
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const TODAY=dstr(new Date());
const normId=x=>String(x??'').trim().replace(/^0+(?=\d)/,'');
function rangeDays(){const out=[],b=pd(ui.to);for(let d=pd(ui.from),i=0;d<=b&&i<120;d.setDate(d.getDate()+1),i++)out.push(dstr(d));return out}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}

/* ---------- storage ---------- */
const KEY='absensi-karyawan-v3',OLDKEY='absensi-karyawan-v2';
function loadS(){for(const k of [KEY,OLDKEY]){try{const j=localStorage.getItem(k);if(j)return JSON.parse(j)}catch(e){}}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function migrate(s){
  s.set=s.set||DEFAULT_SET();
  s.set.shifts.forEach(x=>{if(x.rot==null)x.rot=x.id!=='reg'});
  if(s.set.rate==null)s.set.rate=24000;
  s.set.holidays=s.set.holidays||[];
  s.emps=s.emps||[];
  s.emps.forEach(e=>{e.pos=e.pos||'';e.sched=e.sched||'tetap';e.pay=e.pay||'Bulanan';e.rate=+e.rate||0;e.off=!!e.off;e.ot=!!e.ot});
  s.att=s.att||{};s.spl=s.spl||[];s.imports=s.imports||[];
  s.spl.forEach(x=>{if(x.status==='Diajukan')x.status='Disetujui';else if(x.status==='Ditolak')x.status='Dibatalkan'});
  return s;
}

/* ---------- demo data ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function DEFAULT_SET(){return {shifts:[{id:'reg',name:'Kantor',start:'08:00',end:'16:30',rot:false},{id:'pagi',name:'Shift 1',start:'07:00',end:'15:00',rot:true},{id:'siang',name:'Shift 2',start:'15:00',end:'23:00',rot:true},{id:'malam',name:'Shift 3',start:'23:00',end:'07:00',rot:true}],tol:10,minOT:30,rate:24000,sat:false,holidays:['2026-08-17','2026-12-25']}}
function demo(){
  const R=rng(7),set=DEFAULT_SET();
  const F=['Agus','Budi','Siti','Dewi','Rina','Andi','Eko','Wahyu','Fitri','Yusuf','Dian','Ratna','Hendra','Lestari','Joko','Sri','Rizki','Nur','Putri','Bayu','Indah','Dedi','Anisa','Taufik','Maya','Irfan','Yuni','Fajar','Ayu','Slamet'];
  const L=['Santoso','Pratama','Wijaya','Hidayat','Saputra','Kurniawan','Rahayu','Setiawan','Nugroho','Permana','Utami','Susanto','Ramadhan','Firmansyah','Hartono','Purnama','Wulandari','Maulana','Siregar','Kusuma'];
  const D=[['Produksi',90,.6,'Mingguan',['pagi','siang','malam']],['Gudang',36,.6,'2 mingguan',['pagi','siang']],['Maintenance',18,.6,'2 mingguan',['pagi','siang','malam']],
          ['Admin',22,.05,'Bulanan',null],['Keuangan',12,0,'Bulanan',null],['HRD',10,0,'Bulanan',null],['IT',8,.1,'Bulanan',null],['Marketing',28,.1,'Bulanan',null]];
  const emps=[],rot={};let n=1001;
  D.forEach(([dept,c,p,pay,rs])=>{for(let i=0;i<c;i++){
    const head=i===0,id=String(n++);
    emps.push({id,name:F[Math.floor(R()*F.length)]+' '+L[Math.floor(R()*L.length)],dept,pos:head?'Kepala':(rs?'Operator':'Staf'),
      sched:(rs&&!head)?'bergilir':'tetap',shift:'reg',pay,rate:head?35000:0,ot:head?true:R()<p,off:false});
    if(rs&&!head)rot[id]={rs,off:i};
  }});
  const att={},spl=[],otMap={};
  const t0=new Date(2026,9,1),t1=new Date(2026,10,6);
  for(let d=new Date(t0);d<=t1;d.setDate(d.getDate()+1)){
    const dow=d.getDay();if(dow===0||dow===6)continue;const ds=dstr(d),wk=Math.floor((dayNum(ds)-dayNum('2026-10-01'))/7);
    emps.forEach(e=>{
      const ro=rot[e.id],shId=ro?ro.rs[(wk+ro.off)%ro.rs.length]:'reg',sh=set.shifts.find(x=>x.id===shId);

  Object.values(otMap).filter(o=>o.emps.length).sort((a,b)=>a.ds<b.ds?-1:1).forEach(o=>{

function isHoliday(ds){const dow=pd(ds).getDay();return S.set.holidays.includes(ds)||dow===0||(dow===6&&!S.set.sat)}

  let c=S.set.shifts.filter(s=>s.rot);if(!c.length)c=S.set.shifts;
  let best=null;
  c.forEach(s=>{const diff=Math.abs(((t-toMin(s.start)+720)%1440+1440)%1440-720);if(!best||diff<best.dist)best={id:s.id,dist:diff}});
  return best;
}
function dayInfo(e,ds){
  const r=S.att[e.id+'|'+ds]||{},rot=e.sched==='bergilir',hol=rot?false:isHoliday(ds);
  const sh=(rot&&S.set.shifts.find(x=>x.id===(r.shov||r.sh)))||shiftOf(e);
  const night=isNight(sh),inM=toMin(r.in),outM=toMin(r.out)+(r.nd?1440:0),sEnd=toMin(sh.end)+(night?1440:0);
  const complete=r.n>1&&inM!=null&&outM-inM>=30;
  let status,late=0;
  if(r.ov)status=r.ov;
  else if(r.in){
    if(!complete)status='Tidak lengkap';
    else if(!hol&&inM>toMin(sh.start)+S.set.tol){status='Terlambat';late=inM-toMin(sh.start)}
    else status='Hadir';
  }else status=rot?(ds<TODAY?'Tanpa scan':'—'):hol?'Libur':(ds<TODAY?'Alpa':'—');
  let ot=0;
  if(complete&&!r.ov){
    if(hol){let w=outM-inM;if(w>300)w-=60;ot=w>=S.set.minOT?w:0}
    else{const x=outM-sEnd;ot=x>=S.set.minOT?x:0}
  }
  const spl=S.spl.find(s=>s.status==='Disetujui'&&s.date===ds&&s.emps.includes(e.id));
  let paid=0,flag='';
  if(ot>0){
    if(!spl)flag=e.ot?'Tanpa SPL':'Tidak berhak lembur';
    else if(!e.ot)flag='Tidak berhak lembur';
    else paid=Math.floor(Math.min(ot,dur(spl))/30)*30;

}
function recap(e,days){

  days.forEach(ds=>{const i=dayInfo(e,ds);

    if(['Izin','Sakit','Cuti'].includes(i.status))o.izin++;

    if(i.status==='Tanpa scan')o.noscan++;

  return o;
}

const EF=[['id','ID / PIN fingerprint',/pin|\bid\b|nik|badge|no\.?\s*id/i],['name','Nama',/nama|name/i],['dept','Departemen',/dept|departemen|bagian|divisi/i],['pos','Jabatan',/jabatan|posisi|position/i],['sched','Jenis jadwal',/jadwal|schedule/i],['shift','Shift tetap',/shift/i],['pay','Kelompok gaji',/gaji|kelompok|periode|payroll/i],['rate','Tarif lembur',/tarif|rate/i],['ot','Boleh lembur',/lembur|overtime|\bot\b/i],['off','Status',/status|aktif/i]];
const TEMPLATE='ID/PIN\tNama\tDepartemen\tJabatan\tJenis jadwal\tShift tetap\tKelompok gaji\tTarif lembur\tBoleh lembur\tStatus\n1001\tContoh Satu\tProduksi\tOperator\tBergilir\t\tMingguan\t\tYa\tAktif\n2001\tContoh Dua\tAdmin\tStaf\tTetap\tKantor\tBulanan\t\tTidak\tAktif';
V['impor-karyawan']=()=>tb('Impor karyawan','<button class="btn" data-act="copytpl">Salin template</button><button class="btn" data-act="dltpl">Unduh template</button>','Unggah daftar karyawan dari Excel atau CSV, atau tempel langsung dari Excel. ID harus sama dengan PIN di mesin fingerprint.')+

  <section class="panel pad" style="display:flex;flex-direction:column;gap:10px"><h2>Atau tempel dari Excel</h2><textarea id="paste" rows="4" placeholder="Salin sel-sel di Excel (termasuk baris judul) lalu tempel di sini"></textarea><div><button class="btn" data-act="readpaste">Baca data tempelan</button></div></section>
  <div id="iebox">${ieBox()}</div>`;
function parseText(t){
  const lines=t.split(/\r?\n/).filter(l=>l.trim()),l0=lines[0]||'';
  const dl=l0.includes('\t')?'\t':l0.includes(';')?';':l0.includes(',')?',':/\s+/;
  return lines.map(l=>l.split(dl).map(x=>x.trim().replace(/^"|"$/g,'')));
}
async function readRows(f){
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext==='xlsx'||ext==='xls'){
    if(!window.XLSX)throw new Error('Pustaka Excel belum termuat. Simpan file sebagai CSV lalu unggah lagi.');
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,dateNF:'yyyy-mm-dd hh:mm:ss',defval:''}).filter(r=>r.some(c=>String(c).trim()));
  }
  return parseText(await f.text());
}
function ieGuess(rows){
  const first=rows[0]||[],hasHead=first.some(c=>/[a-zA-Z]{2,}/.test(c)&&EF.some(f=>f[2].test(c)));
  const n=Math.max(...rows.slice(0,30).map(r=>r.length),1),map={},used=new Set();
  EF.forEach(([k,,re],idx)=>{map[k]=-1;if(hasHead)for(let i=0;i<n;i++)if(!used.has(i)&&re.test(String(first[i]))){map[k]=i;used.add(i);break}});
  if(!hasHead)EF.forEach(([k],i)=>{map[k]=i<n?i:-1});
  return {head:hasHead?first.map(String):null,data:hasHead?rows.slice(1):rows,map,ncol:n};
}
const nrm=s=>String(s||'').trim().toLowerCase();
function ieAnalyze(){
  const ie=ui.ie,m=ie.map,seen=new Set(),EM=S.demo?new Map():EMap(),items=[],counts={baru:0,update:0,sama:0,error:0,skip:0},ids=new Set();
  ie.data.forEach((r,idx)=>{
    const g=k=>m[k]>=0?String(r[m[k]]??'').trim():'';
    if(r.every(c=>!String(c).trim()))return;
    const id=normId(g('id')),name=g('name'),rec={},iss=[];
    let st='ok';
    if(!id){st='error';iss.push('ID kosong')}
    else if(seen.has(id)){st='error';iss.push('ID kembar di file')}
    if(id)seen.add(id);
    const ex=id?EM.get(id):null;
    if(!ex&&!name&&st!=='error'){st='error';iss.push('Nama kosong untuk karyawan baru')}
    if(name)rec.name=name;
    if(g('dept'))rec.dept=g('dept');
    if(g('pos'))rec.pos=g('pos');
    const sc=nrm(g('sched'));if(sc){if(/gilir|rotasi|shift/.test(sc))rec.sched='bergilir';else if(/tetap|kantor|normal/.test(sc))rec.sched='tetap';else iss.push('Jenis jadwal tidak dikenal ("'+g('sched')+'")')}
    const sf=nrm(g('shift'));if(sf){const sh=S.set.shifts.find(x=>nrm(x.name)===sf||x.id===sf||sf.includes(x.start));if(sh)rec.shift=sh.id;else iss.push('Shift tidak dikenal ("'+g('shift')+'")')}
    const py=nrm(g('pay'));if(py){if(/2|dua|bi/.test(py))rec.pay='2 mingguan';else if(/minggu/.test(py))rec.pay='Mingguan';else if(/bulan/.test(py))rec.pay='Bulanan';else iss.push('Kelompok gaji tidak dikenal ("'+g('pay')+'")')}
    const rt=g('rate').replace(/[^\d]/g,'');if(rt)rec.rate=+rt;
    const ot=nrm(g('ot'));if(ot){if(/^(ya|y|yes|1|true|boleh|ok)$/.test(ot))rec.ot=true;else if(/^(tidak|t|no|n|0|false|tdk)$/.test(ot))rec.ot=false;else iss.push('Boleh lembur tidak dikenal ("'+g('ot')+'")')}
    const of=nrm(g('off'));if(of){if(/non|tidak|resign|keluar|berhenti|^0$|^no$|^false$/.test(of))rec.off=true;else rec.off=false}
    if(st!=='error'){
      if(!ex)st='baru';
      else if(ie.mode==='new')st='skip';
      else st=Object.keys(rec).some(k=>ex[k]!==rec[k])?'update':'sama';
    }
    counts[st==='ok'?'sama':st]++;
    if(id&&st!=='error')ids.add(id);
    items.push({row:idx+2,id,name,rec,st,iss});
  });
  const gone=ie.mode==='sync'&&!S.demo?S.emps.filter(e=>!ids.has(e.id)&&!e.off).length:0;
  ie.res={items,counts,gone,probs:items.filter(i=>i.st==='error'||i.iss.length)};
}
function ieBox(){

    <div class="stats"><div class="stat g"><b>${c.baru}</b><span>Karyawan baru</span></div><div class="stat"><b>${c.update}</b><span>Diperbarui</span></div><div class="stat"><b>${c.sama+c.skip}</b><span>Tanpa perubahan</span></div><div class="stat ${c.error?'b':''}"><b>${c.error}</b><span>Bermasalah (dilewati)</span></div>${ie.mode==='sync'?`<div class="stat w"><b>${r.gone}</b><span>Akan dinonaktifkan</span></div>`:''}</div>
    ${r.probs.length?`<div><h2>Perlu dicek</h2><ul class="issues">${r.probs.slice(0,8).map(p=>`<li>Baris ${p.row}${p.id?' (ID '+esc(p.id)+')':''}: ${p.iss.map(esc).join(', ')}${p.st==='error'?' – dilewati':' – kolom ini diabaikan'}</li>`).join('')}${r.probs.length>8?`<li>dan ${r.probs.length-8} lainnya</li>`:''}</ul></div>`:''}
    ${S.demo?'<p class="sub" style="color:var(--warn)">Data contoh yang masih ada (karyawan, absensi, SPL) akan dihapus otomatis saat Anda menerapkan impor ini, supaya tidak tercampur dengan data asli.</p>':''}<p class="sub">Karyawan yang tidak ada di file tidak dihapus, hanya dinonaktifkan jika Anda memilih mode Sinkronkan. Yang nonaktif disembunyikan dari daftar dan tidak masuk hitungan harian.</p>
    <div class="tools"><button class="btn primary" data-act="applyie" ${c.baru+c.update+(ie.mode==='sync'?r.gone:0)?'':'disabled'}>Terapkan</button><button class="btn" data-act="cancelie">Batal</button></div></section>`;
}
function startIe(rows,file){
  if(!rows.length)throw new Error('Data kosong.');
  const g=ieGuess(rows);ui.ie={file,rows,head:g.head,data:g.data,map:g.map,ncol:g.ncol,mode:'upd'};ieAnalyze();
}
function applyIe(){
  const ie=ui.ie;if(S.demo){S.emps=[];S.att={};S.spl=[];S.imports=[];S.demo=false;ieAnalyze()}const r=ie.res,ids=new Set();let a=0,u=0;
  r.items.forEach(it=>{
    if(it.st==='error')return;ids.add(it.id);
    const clean={...it.rec};
    if(it.st==='baru'){S.emps.push({id:it.id,name:'Karyawan '+it.id,dept:'Belum diatur',pos:'',sched:'tetap',shift:S.set.shifts[0].id,pay:'Bulanan',rate:0,ot:false,off:false,...clean});a++}
    else if(it.st==='update'){Object.assign(S.emps.find(e=>e.id===it.id),clean);u++}
  });
  let off=0;if(ie.mode==='sync')S.emps.forEach(e=>{if(!ids.has(e.id)&&!e.off){e.off=true;off++}});
  S.emps.sort((x,y)=>x.id.localeCompare(y.id,undefined,{numeric:true}));
  if(S.demo&&a)S.demo=false;
  save();ui.ie=null;render();toast(`Selesai: ${a} baru, ${u} diperbarui${off?', '+off+' dinonaktifkan':''}`);
}

/* ---------- import fingerprint ---------- */
const DT=/\d{4}[-\/]\d{1,2}[-\/]\d{1,2}|\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4}/,TM=/\d{1,2}:\d{2}/;
function parseDT(s){
  s=String(s).trim();let m=s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/),y,mo,d;
  if(m){y=+m[1];mo=+m[2];d=+m[3]}else{m=s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);if(!m)return null;d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=2000}
  const t=s.match(/(\d{1,2}):(\d{2})/);if(!t||mo<1||mo>12||d<1||d>31)return null;
  return {date:`${y}-${pad(mo)}-${pad(d)}`,time:pad(+t[1])+':'+t[2]};
}
function guess(rows){
  const first=rows[0]||[],hasHead=first.some(c=>/[a-zA-Z]{3,}/.test(c))&&!first.some(c=>DT.test(c));
  const head=hasHead?first.map(String):null,data=hasHead?rows.slice(1):rows,smp=data.slice(0,30),n=Math.max(...rows.slice(0,30).map(r=>r.length),1);
  const frac=(i,fn)=>smp.length?smp.filter(r=>fn(String(r[i]??''))).length/smp.length:0;
  const map={id:-1,name:-1,dt:-1,tm:-1};
  for(let i=0;i<n;i++){const h=head?String(head[i]).toLowerCase():'';
    if(map.id<0&&/pin|\bid\b|badge|nik|no\.?\s*id|userid/.test(h))map.id=i;
    if(map.name<0&&/nama|name/.test(h))map.name=i;}
  for(let i=0;i<n;i++){if(frac(i,s=>DT.test(s)&&TM.test(s))>.6){map.dt=i;break}}
  if(map.dt<0){for(let i=0;i<n;i++)if(frac(i,s=>DT.test(s))>.6){map.dt=i;break}
    for(let i=0;i<n;i++)if(i!==map.dt&&frac(i,s=>TM.test(s)&&!DT.test(s))>.6){map.tm=i;break}}
  if(map.id<0){for(let i=0;i<n;i++)if(i!==map.dt&&i!==map.tm&&frac(i,s=>/^\d+$/.test(s))>.6){map.id=i;break}}
  if(map.id<0)map.id=0;if(map.dt<0)map.dt=Math.min(1,n-1);
  return {head,data,map,ncol:n};
}
function analyze(){
  const im=ui.imp,m=im.map,per={},names={};let valid=0,bad=0;
  im.data.forEach(r=>{
    const id=normId(r[m.id]??'');let s=String(r[m.dt]??'');if(m.tm>=0)s+=' '+(r[m.tm]??'');
    const p=parseDT(s);if(!id||!p){bad++;return}
    valid++;if(m.name>=0&&r[m.name])names[id]=String(r[m.name]).trim();
    (per[id]=per[id]||[]).push(dayNum(p.date)*1440+toMin(p.time));
  });
  const EM=EMap(),groups=new Map(),ids=new Set(Object.keys(per));
  const add=(id,dn,a,b,n)=>{const k=id+'|'+numDate(dn),g=groups.get(k);if(!g)groups.set(k,{a,b,n});else{g.a=Math.min(g.a,a);g.b=Math.max(g.b,b);g.n+=n}};
  ids.forEach(id=>{
    const arr=per[id].sort((x,y)=>x-y),e=EM.get(id),sess=e&&(e.sched==='bergilir'||isNight(shiftOf(e)));
    if(!sess){arr.forEach(v=>{const dn=Math.floor(v/1440),t=v-dn*1440;add(id,dn,t,t,1)});return}
    let start=arr[0],prev=arr[0],cnt=1;
    const flush=()=>{const dn=Math.floor(start/1440);add(id,dn,start-dn*1440,prev-dn*1440,cnt)};
    for(let i=1;i<arr.length;i++){if(arr[i]-prev>600){flush();start=arr[i];cnt=0}prev=arr[i];cnt++}
    flush();
  });
  let min='',max='';groups.forEach((g,k)=>{const d=k.split('|')[1];if(!min||d<min)min=d;if(!max||d>max)max=d});
  im.res={valid,bad,ids,groups,names,min,max,unknown:[...ids].filter(i=>!EM.has(i)).length};
}
async function handleFile(f){
  try{
    const rows=await readRows(f);if(!rows.length)throw new Error('File kosong.');
    const g=guess(rows);ui.imp={file:f.name,rows,head:g.head,data:g.data,map:g.map,ncol:g.ncol};analyze();
  }catch(e){ui.imp={err:e.message||'File tidak bisa dibaca.'}}
  $('#impbox').innerHTML=impBox();
}
function applyImport(){
  const r=ui.imp.res;let newE=0;
  r.ids.forEach(id=>{if(!S.emps.find(e=>e.id===id)){S.emps.push({id,name:r.names[id]||'Karyawan '+id,dept:'Belum diatur',pos:'',sched:'tetap',shift:S.set.shifts[0].id,pay:'Bulanan',rate:0,ot:false,off:false});newE++}});
  const EM=EMap();
  r.groups.forEach((g,k)=>{
    const id=k.split('|')[0],e=EM.get(id),old=S.att[k]||{},rec={...old,in:fromMin(g.a%1440),out:fromMin(g.b%1440),n:g.n};
    if(g.b>=1440)rec.nd=1;else delete rec.nd;
    if(e&&e.sched==='bergilir'){const det=detectShift(g.a%1440);rec.sh=det.id;rec.un=det.dist>120?1:0}else{delete rec.sh;delete rec.un}
    S.att[k]=rec;
  });
  (S.imports=S.imports||[]).unshift({file:ui.imp.file,at:new Date().toLocaleString('id-ID'),rows:r.valid,days:r.groups.size,newEmps:newE});
  ui.day=r.max;ui.from=r.max.slice(0,7)+'-01';ui.to=r.max;S.emps.sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
  save();ui.imp=null;render();toast(`Impor selesai: ${r.groups.size} hari-orang`);
}

function wireDrop(dz,fi,fn){
  const z=$(dz),f=$(fi);if(!z||!f)return;
  f.onchange=()=>f.files[0]&&fn(f.files[0]);
  ['dragover','dragenter'].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();z.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();z.classList.remove('over')}));
  z.addEventListener('drop',e=>{const x=e.dataTransfer.files[0];if(x)fn(x)});
}
function restore(text){
  try{const j=JSON.parse(text);if(!j||!Array.isArray(j.emps)||typeof j.att!=='object')throw 0;S=migrate(j);save();const l=latest();Object.assign(ui,{day:l,from:l.slice(0,7)+'-01',to:l});render();toast('Data dipulihkan')}
  catch(e){toast('Isi cadangan tidak valid')}
}
function gsearch(v){
  const box=$('#gsr');if(!v.trim()){box.hidden=true;return}
  const q=v.toLowerCase(),rows=S.emps.filter(e=>(e.name+' '+e.id).toLowerCase().includes(q)).slice(0,8);
  box.innerHTML=rows.map(e=>`<button data-act="gopen" data-id="${esc(e.id)}"><span><b>${esc(e.name)}</b> <span class="muted">${esc(e.id)}</span></span><span class="muted">${esc(e.dept)}${e.off?' · nonaktif':''}</span></button>`).join('')||'<div class="empty" style="padding:12px">Tidak ditemukan.</div>';
  box.hidden=false;
}

/* ---------- events ---------- */
const ACT={
  go(a,e){e.preventDefault();const v=a.dataset.v,sub=a.dataset.sub;if(sub){if(v==='lembur')ui.splTab=sub;if(v==='pengaturan')ui.setTab=sub}if(location.hash==='#'+v)setView();else location.hash=v},
  theme(){const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),nx=cur==='dark'?'light':'dark';r.dataset.theme=nx;try{localStorage.setItem('absensi-theme',nx)}catch(e){}},
  prev(){ui.page--;refresh()},next(){ui.page++;refresh()},
  open(a){ui.drawer=a.dataset.id;render()},gopen(a){ui.drawer=a.dataset.id;$('#gsr').hidden=true;$('#gs').value='';render()},
  closedrawer(){closeAll()},closemodal(){ui.editSpl=null;layer().innerHTML=''},
  ovclick(a,e){if(e.target===a){ui.drawer?closeAll():layer().innerHTML=''}},
  dayprev(){const d=pd(ui.day);d.setDate(d.getDate()-1);ui.day=dstr(d);render()},
  daynext(){const d=pd(ui.day);d.setDate(d.getDate()+1);ui.day=dstr(d);render()},
  editspl(a){newSplModal(a.dataset.id)},
  cancelspl(a){const id=a.dataset.id;if(ui.cx!==id){ui.cx=id;refresh();return}ui.cx=null;S.spl.find(x=>x.id===id).status='Dibatalkan';save();render();toast('SPL dibatalkan')},
  restorespl(a){S.spl.find(x=>x.id===a.dataset.id).status='Disetujui';save();render();toast('SPL diaktifkan lagi')},
  
  newspl(){newSplModal()},savespl(){saveSpl()},viewspl(a){viewSpl(a.dataset.id)},
  copyspl(a){copyText(splText(S.spl.find(x=>x.id===a.dataset.id)),'Teks SPL tersalin')},
  pickall(){document.querySelectorAll('#picklist input').forEach(i=>{pick.sel.add(i.dataset.id);i.checked=true});$('#spl-count').textContent=pick.sel.size+' dipilih'},
  newemp(){newEmpModal()},
  saveemp(){const id=normId($('#ne-id').value),name=$('#ne-name').value.trim(),err=m=>$('#ne-err').textContent=m;
    if(!id||!name)return err('ID dan nama wajib diisi.');if(S.emps.some(e=>e.id===id))return err('ID sudah dipakai.');
    S.emps.push({id,name,dept:$('#ne-dept').value.trim()||'Belum diatur',pos:$('#ne-pos').value.trim(),sched:$('#ne-sched').value,shift:$('#ne-shift').value,pay:$('#ne-pay').value,rate:+$('#ne-rate').value||0,ot:$('#ne-ot').checked,off:false});
    save();layer().innerHTML='';render();toast('Karyawan ditambahkan')},
  applyimp(){applyImport()},cancelimp(){ui.imp=null;$('#impbox').innerHTML=''},
  readpaste(){const t=$('#paste').value;if(!t.trim()){toast('Tempel data dulu');return}try{startIe(parseText(t),'Data tempelan')}catch(e){ui.ie={err:e.message}}$('#iebox').innerHTML=ieBox()},
  applyie(){applyIe()},cancelie(){ui.ie=null;$('#iebox').innerHTML=''},
  copytpl(){copyText(TEMPLATE,'Template tersalin, tempel di Excel')},
  dltpl(){download('template-karyawan.csv',TEMPLATE.split('\n').map(l=>l.split('\t').join(',')).join('\n'),'text/csv')},
  selall(a){const rows=kRows();if(a.checked)rows.forEach(e=>ui.sel.add(e.id));else rows.forEach(e=>ui.sel.delete(e.id));refresh()},
  bk(a){const f=a.dataset.f,v=a.dataset.v;S.emps.forEach(e=>{if(!ui.sel.has(e.id))return;if(f==='ot')e.ot=v==='1';if(f==='sched')e.sched=v;if(f==='off')e.off=v==='1'});save();toast(ui.sel.size+' karyawan diubah');ui.sel=new Set();render()},
  bkrate(){const v=+$('#bkrate').value;if(!(v>=0)||$('#bkrate').value===''){toast('Isi tarif dulu');return}S.emps.forEach(e=>{if(ui.sel.has(e.id))e.rate=v});save();toast(ui.sel.size+' karyawan diubah');ui.sel=new Set();render()},
  bkclear(){ui.sel=new Set();refresh()},
  delallmodal(){if(!S.emps.length){toast('Daftar karyawan sudah kosong');return}
    modal(`<div class="tb" style="padding:0"><h1>Hapus semua karyawan</h1><button class="btn" data-act="closemodal">Tutup</button></div>
    <p>Daftar <b>${S.emps.length} karyawan</b> akan dihapus. Data scan dan SPL tidak ikut terhapus: jika Anda mengimpor ulang dengan ID yang sama, absensi lama menempel kembali.</p>
    <p class="sub">Karyawan yang sudah resign lebih baik dinonaktifkan, bukan dihapus. Penghapusan tidak bisa dibatalkan, jadi simpan cadangan dulu.</p>
    <div class="tools"><button class="btn" data-act="copybackup">Salin cadangan</button><button class="btn" data-act="dlbackup">Unduh cadangan</button></div>
    <label class="f">Ketik HAPUS untuk melanjutkan<input type="text" id="del-conf" data-bind="delconf" autocomplete="off"></label>
    <div class="tools" style="justify-content:flex-end"><button class="btn" data-act="closemodal">Batal</button><button class="btn bad" id="del-go" data-act="delall" disabled>Hapus semua karyawan</button></div>`)},
  delall(){if(($('#del-conf')||{}).value!=='HAPUS')return;const n=S.emps.length;S.emps=[];ui.sel=new Set();layer().innerHTML='';save();render();toast(`${n} karyawan dihapus. Absensi dan SPL tetap tersimpan.`)},
  delselmodal(){const n=ui.sel.size;if(!n){toast('Pilih karyawan dulu');return}
    modal(`<div class="tb" style="padding:0"><h1>Hapus ${n} karyawan?</h1><button class="btn" data-act="closemodal">Tutup</button></div>
    <p>Data scan dan SPL mereka tetap tersimpan, tapi tidak tampil lagi di daftar dan rekap. Karyawan yang sudah resign lebih baik dinonaktifkan. Penghapusan tidak bisa dibatalkan.</p>
    <div class="tools" style="justify-content:flex-end"><button class="btn" data-act="closemodal">Batal</button><button class="btn bad" data-act="delsel">Hapus ${n} karyawan</button></div>`)},
  delsel(){const n=ui.sel.size;S.emps=S.emps.filter(e=>!ui.sel.has(e.id));ui.sel=new Set();layer().innerHTML='';save();render();toast(n+' karyawan dihapus')},
  copyrekap(){const RD=rangeDays(),rows=S.emps.filter(matchQ).map(e=>({e,o:recap(e,RD)})).filter(({e,o})=>!e.off||o.hadir+o.izin+o.inc>0);
    const h=['ID','Nama','Departemen','Jabatan','Kelompok gaji','Tarif/jam','Hadir','Telat','Izin/Sakit/Cuti','Alpa','Tanpa scan','Tidak lengkap','Lembur (jam)','Estimasi lembur (Rp)'];
    copyText([`Periode\t${ui.from}\t${ui.to}`,h.join('\t'),...rows.map(({e,o})=>[e.id,e.name,e.dept,e.pos,e.pay,rateOf(e),o.hadir,o.telat,o.izin,o.alpa,o.noscan,o.inc,fmtH(o.otMin),Math.round(o.amt)].join('\t'))].join('\n'),'Tersalin, tempel di Excel')},
  addhol(){const v=$('#holin').value;if(v&&!S.set.holidays.includes(v)){S.set.holidays.push(v);save();render()}},
  delhol(a,e){e.preventDefault();S.set.holidays=S.set.holidays.filter(h=>h!==a.dataset.id);save();render()},
  dlbackup(){download('cadangan-absensi-'+TODAY+'.json',JSON.stringify(S),'application/json')},
  copybackup(){copyText(JSON.stringify(S),'Cadangan tersalin')},
  restoretxt(){restore($('#restoretxt').value)},
  demo(){if(S.emps.length&&!ui.cd){ui.cd=true;render();return}ui.cd=false;S=demo();save();const l=latest();Object.assign(ui,{day:l,from:l.slice(0,7)+'-01',to:l});render();toast('Data contoh dimuat')},
  wipe(){if(!ui.confirm){ui.confirm=true;render();return}S=migrate({demo:false,emps:[],att:{},spl:[],set:DEFAULT_SET(),imports:[]});ui.confirm=false;save();render();toast('Semua data dihapus')}
};
document.addEventListener('click',e=>{
  if(!e.target.closest('.search'))$('#gsr').hidden=true;
  const a=e.target.closest('[data-act]');if(!a)return;
  if(e.target.closest('select,input,label.sw')&&a.dataset.act==='open')return;
  if(a.dataset.act==='selall'&&a.tagName!=='INPUT')return;
  const f=ACT[a.dataset.act];if(f)f(a,e)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#gs').focus()}});
function onBind(e){
  const t=e.target,b=t.dataset.bind;if(!b)return;
  const live=e.type==='input',LIVE=['q','splq','gs','delconf'];
  if(live&&!LIVE.includes(b))return;
  if(!live&&LIVE.includes(b))return;
  const em=()=>S.emps.find(x=>x.id===t.dataset.id);
  switch(b){
    case 'gs':gsearch(t.value);break;
    case 'delconf':$('#del-go').disabled=t.value.trim()!=='HAPUS';break;
    case 'q':ui.q=t.value;ui.page=0;refresh();break;
    case 'dept':ui.dept=t.value;ui.page=0;refresh();break;
    case 'pay':ui.pay=t.value;ui.page=0;refresh();break;
    case 'showoff':ui.showOff=t.checked;ui.page=0;refresh();break;
    case 'from':if(t.value){ui.from=t.value;if(ui.to<ui.from)ui.to=ui.from;ui.page=0;render()}break;
    case 'to':if(t.value){ui.to=t.value;if(ui.from>ui.to)ui.from=ui.to;ui.page=0;render()}break;
    case 'preset':{const v=t.value,t0=pd(TODAY),mon=new Date(t0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));let f,end;
      if(v==='tw'){f=dstr(mon);end=TODAY}
      else if(v==='lw'){const a=new Date(mon);a.setDate(a.getDate()-7);const z=new Date(a);z.setDate(z.getDate()+6);f=dstr(a);end=dstr(z)}
      else if(v==='14'){const a=new Date(t0);a.setDate(a.getDate()-14);const z=new Date(t0);z.setDate(z.getDate()-1);f=dstr(a);end=dstr(z)}
      else if(v==='cur'){f=TODAY.slice(0,7)+'-01';end=TODAY}
      else if(v==='prev'){f=dstr(new Date(t0.getFullYear(),t0.getMonth()-1,1));end=dstr(new Date(t0.getFullYear(),t0.getMonth(),0))}
      if(f){ui.from=f;ui.to=end;ui.page=0;render()}break}
    case 'day':if(t.value){ui.day=t.value;render()}break;
    case 'sel':t.checked?ui.sel.add(t.dataset.id):ui.sel.delete(t.dataset.id);refresh();break;
    case 'emp':{const x=em(),f=t.dataset.f;if(!x)break;
      if(f==='ot')x.ot=t.checked;else if(f==='on')x.off=!t.checked;else if(f==='rate')x.rate=Math.max(0,+t.value||0);else x[f]=t.value;
      save();if(['sched','on'].includes(f)){const sc=document.querySelector('#main .scroll');const y=window.scrollY;refresh();window.scrollTo(0,y)}break}
    case 'bkpay':if(t.value){S.emps.forEach(x=>{if(ui.sel.has(x.id))x.pay=t.value});save();toast(ui.sel.size+' karyawan diubah');ui.sel=new Set();render()}break;
    case 'bkshift':if(t.value){S.emps.forEach(x=>{if(ui.sel.has(x.id)){x.shift=t.value;x.sched='tetap'}});save();toast(ui.sel.size+' karyawan diubah');ui.sel=new Set();render()}break;
    case 'shiftf':S.set.shifts[+t.dataset.i][t.dataset.k]=t.value;save();break;
    case 'shiftrot':S.set.shifts[+t.dataset.i].rot=t.checked;save();break;
    case 'setn':S.set[t.dataset.k]=Math.max(0,+t.value||0);save();break;
    case 'sat':S.set.sat=t.checked;save();break;
    case 'map':ui.imp.map[t.dataset.k]=+t.value;analyze();$('#impbox').innerHTML=impBox();break;
    case 'iemap':ui.ie.map[t.dataset.k]=+t.value;ieAnalyze();$('#iebox').innerHTML=ieBox();break;
    case 'iemode':ui.ie.mode=t.value;ieAnalyze();$('#iebox').innerHTML=ieBox();break;
    case 'ov':{const x=S.emps.find(y=>y.id===ui.drawer),k=x.id+'|'+t.dataset.ds,r=S.att[k]||(S.att[k]={});
      if(t.value==='__auto')delete r.ov;else if(t.value)r.ov=t.value;
      if(!Object.keys(r).length)delete S.att[k];save();render();break}
    case 'shov':{const x=S.emps.find(y=>y.id===ui.drawer),k=x.id+'|'+t.dataset.ds,r=S.att[k]||(S.att[k]={});
      if(t.value==='__auto')delete r.shov;else if(t.value)r.shov=t.value;
      save();render();break}
    case 'pick':t.checked?pick.sel.add(t.dataset.id):pick.sel.delete(t.dataset.id);$('#spl-count').textContent=pick.sel.size+' dipilih';break;
    case 'spldept':$('#picklist').innerHTML=pickList();break;
    case 'splq':pick.q=t.value;$('#picklist').innerHTML=pickList();break;
  }
}
document.addEventListener('input',onBind);document.addEventListener('change',onBind);
window.addEventListener('hashchange',setView);
try{const th=localStorage.getItem('absensi-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
setView();
</script>
