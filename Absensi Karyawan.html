<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: slim left rail for navigation, one working column; wide tables scroll inside their own box */
:root{
  --bg:#F5F7F6; --surface:#FFFFFF; --ink:#17201E; --muted:#66726E; --line:#E2E7E4; --hover:#F0F4F2;
  --accent:#1F5F54; --accent-ink:#FFFFFF; --accent-soft:#E2EFEB;
  --good:#2C7A58; --good-soft:#E0F1E8; --warn:#9A6A12; --warn-soft:#F8EDD3; --bad:#B03F2B; --bad-soft:#F8E1DC;
  --shadow:0 12px 40px rgba(20,32,28,.14);
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --num:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#151D1A; --ink:#E7EEEB; --muted:#92A09A; --line:#25302C; --hover:#1B2522;
  --accent:#5FBBA6; --accent-ink:#0A1411; --accent-soft:#1A2E29;
  --good:#5CC393; --good-soft:#173126; --warn:#DDAA45; --warn-soft:#352B14; --bad:#EC8570; --bad-soft:#38201B;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#151D1A; --ink:#E7EEEB; --muted:#92A09A; --line:#25302C; --hover:#1B2522;
  --accent:#5FBBA6; --accent-ink:#0A1411; --accent-soft:#1A2E29;
  --good:#5CC393; --good-soft:#173126; --warn:#DDAA45; --warn-soft:#352B14; --bad:#EC8570; --bad-soft:#38201B;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,.mono{font-family:var(--num);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:196px minmax(0,1fr);gap:32px;max-width:1240px;margin:0 auto}
.rail{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:24px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{padding:8px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}

main{min-width:0;display:flex;flex-direction:column;gap:20px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 14px;font-weight:500}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}

h2{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.sub{color:var(--muted);margin:2px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.btn.good{color:var(--good)} .btn.bad{color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=date],input[type=month],input[type=time],input[type=number],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px}

.stat:first-child{border-left:0}

.stat span{color:var(--muted);font-size:12.5px}
.stat.w b{color:var(--warn)} .stat.b b{color:var(--bad)} .stat.g b{color:var(--good)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}
.cols>*{min-width:0}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{min-width:0} .item .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.item .t span{color:var(--muted);font-size:12.5px}
.ph{padding:14px 18px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.empty{padding:28px 18px;color:var(--muted);text-align:center}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--hover)}
td.n,th.n{text-align:right}
td.dim{color:var(--muted)} tr.off td{background:var(--hover);color:var(--muted)}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--hover);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.sw{position:relative;display:inline-block;width:36px;height:20px}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked+i{background:var(--accent)} .sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button:hover{background:var(--hover)} .tabs button.on{background:var(--accent-soft);color:var(--accent)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:36px 18px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop b{display:block;color:var(--ink);font-size:15px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{font-weight:400;color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;position:relative;margin:6px 0 0}
.bars .g{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.bars .g span{position:absolute;right:0;top:-17px;font-size:11px;color:var(--muted);font-family:var(--num)}
.bar{flex:1;min-width:0;background:var(--accent);border-radius:4px 4px 0 0;position:relative;opacity:.85}
.bar.last{opacity:1}
.bar span{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--num)}
.over-ov{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:5vh 16px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(640px,100%);padding:22px;display:flex;flex-direction:column;gap:16px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--surface);box-shadow:var(--shadow);z-index:50;overflow:auto;padding:22px;padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.pick{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.pick label{display:flex;gap:10px;align-items:center;padding:6px 12px;border-top:1px solid var(--line);cursor:pointer}
.pick label:first-child{border-top:0} .pick label:hover{background:var(--hover)}
.letter{border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;z-index:80}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.muted{color:var(--muted)}
main a{color:var(--accent);font-weight:600}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{position:static;flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px 16px}
  .nav{flex-direction:row;overflow-x:auto;max-width:100%;padding-bottom:2px}
  .nav a{white-space:nowrap}
  .stat{border-left:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">Absensi<small id="orgline">Karyawan</small></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const toMin=t=>{if(!t)return null;const p=t.split(':');return +p[0]*60+ +p[1]};
const fromMin=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
const HARI=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=ds=>{const d=pd(ds);return HARI[d.getDay()]+', '+d.getDate()+' '+BULAN[d.getMonth()].slice(0,3)+' '+d.getFullYear()};
const fmtH=m=>m?(m/60).toFixed(1).replace('.',','):'0';
const TODAY=dstr(new Date());
const normId=x=>String(x).trim().replace(/^0+(?=\d)/,'');
const daysOf=mo=>{const [y,m]=mo.split('-').map(Number);const n=new Date(y,m,0).getDate();return Array.from({length:n},(_,i)=>`${y}-${pad(m)}-${pad(i+1)}`)};
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
function rangeDays(){const out=[],b=pd(ui.to);for(let d=pd(ui.from),i=0;d<=b&&i<120;d.setDate(d.getDate()+1),i++)out.push(dstr(d));return out}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}

/* ---------- storage ---------- */
const KEY='absensi-karyawan-v2';
function loadS(){try{const j=localStorage.getItem(KEY);if(j)return JSON.parse(j)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- demo data ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DEFAULT_SET=()=>({shifts:[{id:'reg',name:'Kantor',start:'08:00',end:'16:30'},{id:'pagi',name:'Shift 1',start:'07:00',end:'15:00'},{id:'siang',name:'Shift 2',start:'15:00',end:'23:00'},{id:'malam',name:'Shift 3',start:'23:00',end:'07:00'}],tol:10,minOT:30,rate:24000,sat:false,holidays:['2026-08-17','2026-12-25']});
function demo(){
  const R=rng(7),set=DEFAULT_SET();
  const F=['Agus','Budi','Siti','Dewi','Rina','Andi','Eko','Wahyu','Fitri','Yusuf','Dian','Ratna','Hendra','Lestari','Joko','Sri','Rizki','Nur','Putri','Bayu','Indah','Dedi','Anisa','Taufik','Maya','Irfan','Yuni','Fajar','Ayu','Slamet'];
  const L=['Santoso','Pratama','Wijaya','Hidayat','Saputra','Kurniawan','Rahayu','Setiawan','Nugroho','Permana','Utami','Susanto','Ramadhan','Firmansyah','Hartono','Purnama','Wulandari','Maulana','Siregar','Kusuma'];
  const D=[['Produksi',90,.8],['Gudang',36,.7],['Maintenance',18,.7],['Admin',22,.05],['Keuangan',12,0],['HRD',10,0],['IT',8,.1],['Marketing',28,.1]];
  const emps=[];let n=1001;
  D.forEach(([dept,c,p])=>{for(let i=0;i<c;i++){
    const shift=dept==='Produksi'?(()=>{const x=R();return x<.35?'pagi':x<.7?'siang':'malam'})():dept==='Gudang'?'pagi':'reg';
    emps.push({id:String(n++),name:F[Math.floor(R()*F.length)]+' '+L[Math.floor(R()*L.length)],dept,shift,ot:R()<p})}});
  const att={},spl=[],otMap={};
  const start=new Date(2026,9,1),end=new Date(2026,10,6);
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const dow=d.getDay();if(dow===0||dow===6)continue;const ds=dstr(d);
    emps.forEach(e=>{
      const sh=set.shifts.find(x=>x.id===e.shift),s=toMin(sh.start),en=toMin(sh.end)+(isNight(sh)?1440:0),r=R(),k=e.id+'|'+ds;
      if(r<.015)return;
      if(r<.035){att[k]={ov:['Sakit','Izin','Cuti'][Math.floor(R()*3)]};return}
      if(r<.05){att[k]={in:fromMin((s-Math.floor(R()*10))%1440),out:fromMin((s-Math.floor(R()*10))%1440),n:1};return}
      const inM=Math.round(R()<.08?s+11+R()*40:s-R()*25);
      let outM=Math.round(en+R()*12-4);
      if(e.ot&&(e.shift==='pagi'||e.shift==='reg')&&R()<.26){
        outM=Math.round(en+45+R()*150);
        const key=ds+'|'+e.dept;(otMap[key]=otMap[key]||{ds,dept:e.dept,sh,emps:[],max:0}).max=Math.max(otMap[key].max,outM);
        if(R()<.78)otMap[key].emps.push(e.id);
      }
      att[k]={in:fromMin(inM%1440),out:fromMin(outM%1440),n:2,...(outM>=1440?{nd:1}:{})};
    });
  }
  const cnt={};
  Object.values(otMap).filter(o=>o.emps.length).sort((a,b)=>a.ds<b.ds?-1:1).forEach(o=>{
    const mo=o.ds.slice(0,7);cnt[mo]=(cnt[mo]||0)+1;
    const endM=Math.ceil(o.max/30)*30;
    spl.push({id:'SPL/'+o.ds.slice(0,4)+'/'+o.ds.slice(5,7)+'/'+String(cnt[mo]).padStart(3,'0'),date:o.ds,start:o.sh.end,end:fromMin(endM),
      reason:o.dept==='Produksi'?'Mengejar target produksi':o.dept==='Gudang'?'Bongkar muat kiriman tambahan':'Perbaikan mesin di luar jam kerja',dept:o.dept,emps:o.emps,status:'Disetujui'});
  });
  const eligible=d=>emps.filter(e=>e.ot&&e.dept===d).slice(0,6).map(e=>e.id);
  spl.push({id:'SPL/2026/11/090',date:'2026-11-09',start:'17:00',end:'20:00',reason:'Pesanan mendadak, target kirim Selasa',dept:'Produksi',emps:eligible('Produksi'),status:'Diajukan'});
  spl.push({id:'SPL/2026/11/091',date:'2026-11-07',start:'08:00',end:'13:00',reason:'Stock opname akhir bulan',dept:'Gudang',emps:eligible('Gudang').slice(0,4),status:'Diajukan'});
  return {demo:true,emps,att,spl,set,imports:[]};
}
let S=loadS()||demo();
S.set.holidays=S.set.holidays||[];if(S.set.rate==null)S.set.rate=24000;

/* ---------- business rules ---------- */
function shiftOf(e){return S.set.shifts.find(x=>x.id===e.shift)||S.set.shifts[0]}
function isNight(sh){return toMin(sh.end)<=toMin(sh.start)}
const dur=s=>(toMin(s.end)-toMin(s.start)+1440)%1440;
function eq(h,hol){if(!h)return 0;if(!hol)return Math.min(h,1)*1.5+Math.max(h-1,0)*2;return Math.min(h,8)*2+Math.min(Math.max(h-8,0),1)*3+Math.max(h-9,0)*4}
function isHoliday(ds){const dow=pd(ds).getDay();return S.set.holidays.includes(ds)||dow===0||(dow===6&&!S.set.sat)}
function dayInfo(e,ds){
  const r=S.att[e.id+'|'+ds]||{},hol=isHoliday(ds),sh=shiftOf(e);
  const night=isNight(sh),inM=toMin(r.in),outM=toMin(r.out)+(r.nd?1440:0),sEnd=toMin(sh.end)+(night?1440:0),complete=r.n>1&&inM!=null&&outM-inM>=30;
  let status,late=0;
  if(r.ov)status=r.ov;
  else if(r.in){
    if(!complete)status='Tidak lengkap';
    else if(!hol&&inM>toMin(sh.start)+S.set.tol){status='Terlambat';late=inM-toMin(sh.start)}
    else status='Hadir';
  }else status=hol?'Libur':(ds<TODAY?'Alpa':'—');
  let ot=0;
  if(complete&&!r.ov){
    if(hol){let w=outM-inM;if(w>300)w-=60;ot=w>=S.set.minOT?w:0}
    else{const x=outM-sEnd;ot=x>=S.set.minOT?x:0}
  }
  const spl=S.spl.find(s=>s.status==='Disetujui'&&s.date===ds&&s.emps.includes(e.id));
  let paid=0,flag='';
  if(ot>0){
    if(!spl)flag=e.ot?'Tanpa SPL':'Tidak berhak lembur';
    else if(!e.ot)flag='Tidak berhak lembur';
    else paid=Math.floor(Math.min(ot,dur(spl))/30)*30;
  }
  return {r,hol,sh,status,late,ot,spl,paid,flag,amt:paid/60*(S.set.rate||0)};
}
function recap(e,days){
  const o={hadir:0,telat:0,izin:0,alpa:0,inc:0,otMin:0,amt:0,noSpl:0};
  days.forEach(ds=>{const i=dayInfo(e,ds);
    if(['Hadir','Terlambat','Dinas Luar'].includes(i.status))o.hadir++;
    if(i.status==='Terlambat')o.telat++;
    if(['Izin','Sakit','Cuti'].includes(i.status))o.izin++;
    if(i.status==='Alpa')o.alpa++;
    if(i.status==='Tidak lengkap')o.inc++;
    o.otMin+=i.paid;o.amt+=i.amt;if(i.flag==='Tanpa SPL')o.noSpl++;});
  return o;
}
const pillCls=s=>({'Hadir':'good','Terlambat':'warn','Tidak lengkap':'warn','Alpa':'bad','Izin':'info','Sakit':'info','Cuti':'info','Dinas Luar':'info'}[s]||'');

/* ---------- ui state ---------- */
function latest(){let m='';for(const k in S.att){const d=k.split('|')[1];if(d>m)m=d}return m||TODAY}
const L0=latest();
const ui={view:'ringkasan',month:L0.slice(0,7),day:L0,from:L0.slice(0,7)+'-01',to:L0,q:'',dept:'',page:0,drawer:null,splTab:'Diajukan',imp:null,confirm:false};
const VIEWS=[['ringkasan','Ringkasan'],['impor','Impor fingerprint'],['rekap','Rekap bulanan'],['lembur','Lembur & SPL'],['karyawan','Karyawan'],['pengaturan','Pengaturan']];
const depts=()=>[...new Set(S.emps.map(e=>e.dept))].sort();
const deptOpts=sel=>'<option value="">Semua departemen</option>'+depts().map(d=>`<option ${d===sel?'selected':''}>${esc(d)}</option>`).join('');
const monthOpts=()=>{const set=new Set([ui.month,TODAY.slice(0,7)]);for(const k in S.att)set.add(k.split('|')[1].slice(0,7));return[...set].sort().reverse()};
const monthSel=()=>`<select data-bind="month" id="monthsel">${monthOpts().map(m=>`<option value="${m}" ${m===ui.month?'selected':''}>${BULAN[+m.slice(5)-1]} ${m.slice(0,4)}</option>`).join('')}</select>`;
const PS=40;
function pager(total){const pages=Math.max(1,Math.ceil(total/PS));if(ui.page>=pages)ui.page=pages-1;
  return `<div class="pager"><span>${total?ui.page*PS+1:0}–${Math.min(total,(ui.page+1)*PS)} dari ${total}</span><span class="tools"><button class="btn sm" data-act="prev" ${ui.page<=0?'disabled':''}>Sebelumnya</button><button class="btn sm" data-act="next" ${ui.page>=pages-1?'disabled':''}>Berikutnya</button></span></div>`}
const matchQ=e=>(!ui.dept||e.dept===ui.dept)&&(!ui.q||(e.name+' '+e.id).toLowerCase().includes(ui.q.toLowerCase()));
const sw=(act,id,on)=>`<label class="sw"><input type="checkbox" data-bind="${act}" data-id="${esc(id)}" ${on?'checked':''} aria-label="Boleh lembur"><i></i></label>`;
const pendingN=()=>S.spl.filter(s=>s.status==='Diajukan').length;

/* ---------- views ---------- */
const V={},LST={};

V.ringkasan=()=>{
  if(!S.emps.length)return `<div class="head"><h1>Ringkasan</h1></div><div class="panel empty">Belum ada data karyawan. Buka <a href="#impor">Impor fingerprint</a> atau muat data contoh di <a href="#pengaturan">Pengaturan</a>.</div>`;
  const ds=ui.day,rows=S.emps.map(e=>({e,i:dayInfo(e,ds)})),c=k=>rows.filter(r=>r.i.status===k).length;
  const hadir=c('Hadir'),telat=c('Terlambat'),dinas=c('Dinas Luar'),izin=rows.filter(r=>['Izin','Sakit','Cuti'].includes(r.i.status)).length,alpa=c('Alpa'),inc=c('Tidak lengkap'),otN=rows.filter(r=>r.i.paid>0).length;
  const hol=isHoliday(ds);
  const attn=rows.filter(r=>['Alpa','Tidak lengkap','Terlambat'].includes(r.i.status)).sort((a,b)=>({'Alpa':0,'Tidak lengkap':1,'Terlambat':2}[a.i.status]-({'Alpa':0,'Tidak lengkap':1,'Terlambat':2}[b.i.status])));
  const days=[];for(let d=pd(ds),k=0;k<21&&days.length<14;k++,d.setDate(d.getDate()-1)){const s=dstr(d);if(!isHoliday(s))days.push(s)}days.reverse();
  const pct=days.map(s=>{let n=0;S.emps.forEach(e=>{const st=dayInfo(e,s).status;if(st==='Hadir'||st==='Terlambat'||st==='Dinas Luar')n++});return Math.round(n/S.emps.length*100)});
  const pend=S.spl.filter(s=>s.status==='Diajukan').sort((a,b)=>a.date<b.date?-1:1);
  return `<div class="head"><div><h1>Ringkasan</h1><p class="sub">${fmtDate(ds)}${hol?' · hari libur':''} · ${S.emps.length} karyawan</p></div>
    <div class="tools"><button class="btn" data-act="dayprev" aria-label="Hari sebelumnya">←</button><input type="date" id="daysel" data-bind="day" value="${ds}"><button class="btn" data-act="daynext" aria-label="Hari berikutnya">→</button></div></div>
  <div class="stats">
    <div class="stat g"><b>${hadir+telat+dinas}</b><span>Hadir</span></div>
    <div class="stat w"><b>${telat}</b><span>Terlambat</span></div>
    <div class="stat"><b>${izin}</b><span>Izin / sakit / cuti</span></div>
    <div class="stat b"><b>${alpa}</b><span>Alpa</span></div>
    <div class="stat w"><b>${inc}</b><span>Scan tidak lengkap</span></div>
    <div class="stat"><b>${otN}</b><span>Lembur ber-SPL</span></div></div>
  <div class="cols">
    <section class="panel"><div class="ph"><h2>Perlu perhatian</h2><span class="muted">${attn.length} orang</span></div>
      <div class="list">${attn.slice(0,9).map(r=>`<div class="item"><div class="t"><b>${esc(r.e.name)}</b><span>${esc(r.e.dept)} · ${r.i.r.in?r.i.r.in+' – '+(r.i.r.out&&r.i.r.n>1?r.i.r.out+(r.i.r.nd?' +1':''):'belum pulang'):'tidak ada scan'}${r.i.late?' · telat '+r.i.late+' mnt':''}</span></div><span class="pill ${pillCls(r.i.status)}">${r.i.status}</span></div>`).join('')||'<div class="empty">Tidak ada yang perlu ditindaklanjuti.</div>'}
      ${attn.length>9?`<div class="item muted">+${attn.length-9} lainnya, lihat di <a href="#rekap">Rekap bulanan</a></div>`:''}</div></section>
    <section class="panel"><div class="ph"><h2>SPL menunggu persetujuan</h2><span class="muted">${pend.length}</span></div>
      <div class="list">${pend.map(s=>`<div class="item"><div class="t"><b>${fmtDate(s.date)} · ${s.start}–${s.end}</b><span>${esc(s.dept||'')} · ${s.emps.length} orang · ${esc(s.reason)}</span></div>
        <span class="tools"><button class="btn sm good" data-act="approve" data-id="${esc(s.id)}">Setujui</button><button class="btn sm bad" data-act="reject" data-id="${esc(s.id)}">Tolak</button></span></div>`).join('')||'<div class="empty">Semua SPL sudah diproses.</div>'}</div></section>
  </div>
  <section class="panel pad"><div class="ph" style="padding:0 0 22px"><h2>Kehadiran 14 hari kerja terakhir</h2><span class="muted">% karyawan hadir</span></div>
    <div class="bars"><div class="g" style="bottom:100%"><span>100%</span></div><div class="g" style="bottom:50%"><span>50%</span></div>
      ${pct.map((p,i)=>`<div class="bar ${i===pct.length-1?'last':''}" style="height:${p}%" title="${fmtDate(days[i])}: ${p}%"><span>${days[i].slice(8)}</span></div>`).join('')}</div><div style="height:20px"></div></section>`;
};

V.impor=()=>{
  const im=ui.imp;
  const last=(S.imports||[])[0];
  return `<div class="head"><div><h1>Impor fingerprint</h1><p class="sub">Unggah file dari mesin fingerprint. Format .xlsx, .csv, .txt atau .dat (ID, tanggal, jam).</p></div></div>
  <label class="drop" id="drop" for="file"><b>Tarik file ke sini atau klik untuk memilih</b>Data yang sudah ada di tanggal yang sama akan diperbarui, status manual tetap aman.</label>
  <input type="file" id="file" accept=".xlsx,.xls,.csv,.txt,.dat" hidden>
  <div id="impbox">${impBox()}</div>
  ${last?`<section class="panel"><div class="ph"><h2>Impor terakhir</h2></div><div class="item"><div class="t"><b>${esc(last.file)}</b><span>${last.at} · ${last.rows} baris scan · ${last.days} hari-orang · ${last.newEmps} karyawan baru</span></div></div></section>`:''}`;
};
function colName(i){const h=ui.imp.head;return h&&h[i]?h[i]:'Kolom '+(i+1)}
function impBox(){
  const im=ui.imp;if(!im)return '';
  if(im.err)return `<div class="panel pad" style="color:var(--bad)">${esc(im.err)}</div>`;
  const n=im.ncol,opt=(sel,none)=>(none?`<option value="-1" ${sel<0?'selected':''}>${none}</option>`:'')+Array.from({length:n},(_,i)=>`<option value="${i}" ${i===sel?'selected':''}>${esc(colName(i))}</option>`).join('');
  const r=im.res;
  return `<section class="panel pad" style="display:flex;flex-direction:column;gap:16px">
    <div><h2>Cocokkan kolom</h2><p class="sub">${esc(im.file)} · ${im.rows.length} baris. Sudah ditebak otomatis, ubah bila keliru.</p></div>
    <div class="mapgrid">
      <label class="f">ID / PIN<select data-bind="map" data-k="id">${opt(im.map.id)}</select></label>
      <label class="f">Nama (opsional)<select data-bind="map" data-k="name">${opt(im.map.name,'Tidak ada')}</select></label>
      <label class="f">Tanggal & waktu<select data-bind="map" data-k="dt">${opt(im.map.dt)}</select></label>
      <label class="f">Jam terpisah (opsional)<select data-bind="map" data-k="tm">${opt(im.map.tm,'Tidak ada')}</select></label></div>
    ${r?`<div class="stats"><div class="stat"><b>${r.valid}</b><span>Scan terbaca</span></div><div class="stat ${r.bad?'w':''}"><b>${r.bad}</b><span>Baris dilewati</span></div><div class="stat"><b>${r.ids.size}</b><span>Karyawan</span></div><div class="stat ${r.unknown?'w':''}"><b>${r.unknown}</b><span>ID belum terdaftar</span></div><div class="stat"><b>${r.groups.size}</b><span>Hari-orang</span></div></div>
    <p class="sub">Periode ${r.min?fmtDate(r.min)+' sampai '+fmtDate(r.max):'—'}. Masuk = scan pertama, pulang = scan terakhir. Scan tunggal ditandai "Tidak lengkap". Untuk karyawan shift malam, scan sebelum jam 12:00 dihitung sebagai jam pulang hari sebelumnya.</p>
    <div class="tools"><button class="btn primary" data-act="applyimp" ${r.valid?'':'disabled'}>Terapkan ke absensi</button><button class="btn" data-act="cancelimp">Batal</button></div>`:''}
  </section>`;
}

V.rekap=()=>`<div class="head"><div><h1>Rekap bulanan</h1><p class="sub">Klik baris untuk melihat dan mengoreksi per hari. Nominal lembur adalah estimasi untuk dicek bagian penggajian.</p></div>
  <div class="tools"><input type="date" id="from" data-bind="from" value="${ui.from}" aria-label="Dari tanggal"><span class="muted">sampai</span><input type="date" id="to" data-bind="to" value="${ui.to}" aria-label="Sampai tanggal"><select id="preset" data-bind="preset" aria-label="Pilih cepat"><option value="">Pilih cepat</option><option value="cur">Bulan terakhir (sampai data terbaru)</option><option value="prev">Bulan sebelumnya</option><option value="14">14 hari terakhir</option><option value="7">7 hari terakhir</option></select><select data-bind="dept" id="deptsel">${deptOpts(ui.dept)}</select><input type="text" id="q" data-bind="q" placeholder="Cari nama atau ID" value="${esc(ui.q)}"><button class="btn" data-act="copyrekap">Salin untuk Excel</button></div></div>
  <section class="panel"><div id="list">${LST.rekap()}</div></section>`;
LST.rekap=()=>{
  const RD=rangeDays(),rows=S.emps.filter(matchQ).map(e=>({e,o:recap(e,RD)}));
  const tot=rows.reduce((a,r)=>a+r.o.otMin,0);
  const sl=rows.slice(ui.page*PS,(ui.page+1)*PS);
  return `<div class="pager" style="border:0;border-bottom:1px solid var(--line)"><span>${fmtDate(ui.from)} sampai ${fmtDate(ui.to)} (${RD.length} hari) · ${rows.length} karyawan · lembur dibayar <b class="num">${fmtH(tot)}</b> jam · estimasi <b class="num">${rp(tot/60*S.set.rate)}</b></span></div>
  <div class="scroll"><table><thead><tr><th>Karyawan</th><th class="n">Hadir</th><th class="n">Telat</th><th class="n">Izin/Sakit/Cuti</th><th class="n">Alpa</th><th class="n">Tdk lengkap</th><th class="n">Lembur (jam)</th><th class="n">Estimasi lembur</th></tr></thead>
  <tbody>${sl.map(({e,o})=>`<tr class="click" data-act="open" data-id="${esc(e.id)}"><td><b>${esc(e.name)}</b><br><span class="muted">${esc(e.id)} · ${esc(e.dept)}</span></td>
    <td class="n">${o.hadir}</td><td class="n ${o.telat?'':'dim'}">${o.telat}</td><td class="n ${o.izin?'':'dim'}">${o.izin}</td><td class="n" style="${o.alpa?'color:var(--bad)':'color:var(--muted)'}">${o.alpa}</td><td class="n ${o.inc?'':'dim'}">${o.inc}</td>
    <td class="n">${o.otMin?fmtH(o.otMin):'<span class="muted">0</span>'}${o.noSpl?` <span class="pill warn" title="Lembur tanpa SPL">${o.noSpl} tanpa SPL</span>`:''}</td><td class="n ${o.amt?'':'dim'}">${o.amt?rp(o.amt):'0'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Tidak ada data.</td></tr>'}</tbody></table></div>${pager(rows.length)}`;
};

V.lembur=()=>`<div class="head"><div><h1>Lembur & SPL</h1><p class="sub">Lembur dibayar hanya untuk karyawan berhak yang punya SPL disetujui, sebesar yang lebih kecil antara jam SPL dan jam nyata.</p></div>
  <div class="tools"><button class="btn primary" data-act="newspl">Buat SPL</button></div></div>
  <div class="tools" style="justify-content:space-between"><div class="tabs" id="spltabs">${['Diajukan','Disetujui','Ditolak','Semua','Tanpa SPL'].map(t=>`<button data-act="spltab" data-id="${t}" class="${ui.splTab===t?'on':''}">${t}${t==='Diajukan'&&pendingN()?` (${pendingN()})`:''}</button>`).join('')}</div>${ui.splTab==='Tanpa SPL'?monthSel():''}</div>
  <section class="panel"><div id="list">${LST.lembur()}</div></section>`;
LST.lembur=()=>{
  if(ui.splTab==='Tanpa SPL'){
    const rows=[];S.emps.forEach(e=>daysOf(ui.month).forEach(ds=>{const i=dayInfo(e,ds);if(i.flag)rows.push({e,ds,i})}));
    rows.sort((a,b)=>a.ds<b.ds?-1:a.ds>b.ds?1:0);
    return `<div class="scroll"><table><thead><tr><th>Tanggal</th><th>Karyawan</th><th>Pulang</th><th class="n">Lembur nyata</th><th>Keterangan</th></tr></thead><tbody>${rows.slice(0,200).map(({e,ds,i})=>`<tr><td>${fmtDate(ds)}</td><td><b>${esc(e.name)}</b><br><span class="muted">${esc(e.dept)}</span></td><td class="n">${i.r.out}${i.r.nd?' +1':''}</td><td class="n">${fmtH(i.ot)} jam</td><td><span class="pill ${i.flag==='Tanpa SPL'?'warn':'bad'}">${i.flag}</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Tidak ada lembur di luar SPL pada bulan ini.</td></tr>'}</tbody></table></div>${rows.length>200?`<div class="pager"><span>Menampilkan 200 dari ${rows.length}</span></div>`:''}`;
  }
  const rows=S.spl.filter(s=>ui.splTab==='Semua'||s.status===ui.splTab).sort((a,b)=>a.date<b.date?1:-1);
  return `<div class="scroll"><table><thead><tr><th>Nomor</th><th>Tanggal</th><th>Jam</th><th>Departemen</th><th class="n">Orang</th><th class="n">Biaya maks.</th><th>Pekerjaan</th><th>Status</th><th></th></tr></thead><tbody>
  ${rows.map(s=>`<tr><td class="mono">${esc(s.id)}</td><td>${fmtDate(s.date)}</td><td class="n">${s.start}–${s.end}</td><td>${esc(s.dept||'—')}</td><td class="n">${s.emps.length}</td><td class="n">${rp(s.emps.length*dur(s)/60*S.set.rate)}</td><td>${esc(s.reason)}</td>
    <td><span class="pill ${s.status==='Disetujui'?'good':s.status==='Ditolak'?'bad':'warn'}">${s.status}</span></td>
    <td><span class="tools" style="flex-wrap:nowrap">${s.status==='Diajukan'?`<button class="btn sm good" data-act="approve" data-id="${esc(s.id)}">Setujui</button><button class="btn sm bad" data-act="reject" data-id="${esc(s.id)}">Tolak</button>`:''}<button class="btn sm" data-act="viewspl" data-id="${esc(s.id)}">Lihat</button></span></td></tr>`).join('')||'<tr><td colspan="9" class="empty">Belum ada SPL di tab ini.</td></tr>'}</tbody></table></div>`;
};

V.karyawan=()=>`<div class="head"><div><h1>Karyawan</h1><p class="sub">Atur siapa yang berhak lembur dan jadwal shift masing-masing.</p></div>
  <div class="tools"><select data-bind="dept" id="deptsel">${deptOpts(ui.dept)}</select><input type="text" id="q" data-bind="q" placeholder="Cari nama atau ID" value="${esc(ui.q)}"><button class="btn primary" data-act="newemp">Tambah</button></div></div>
  <section class="panel"><div id="list">${LST.karyawan()}</div></section>`;
LST.karyawan=()=>{
  const rows=S.emps.filter(matchQ),sl=rows.slice(ui.page*PS,(ui.page+1)*PS),ot=S.emps.filter(e=>e.ot).length;
  return `<div class="pager" style="border:0;border-bottom:1px solid var(--line)"><span>${S.emps.length} karyawan · ${ot} berhak lembur</span></div>
  <div class="scroll"><table><thead><tr><th>ID</th><th>Nama</th><th>Departemen</th><th>Shift</th><th>Boleh lembur</th></tr></thead><tbody>
  ${sl.map(e=>`<tr><td class="mono">${esc(e.id)}</td><td><b>${esc(e.name)}</b></td><td>${esc(e.dept)}</td>
   <td><select data-bind="empshift" data-id="${esc(e.id)}" aria-label="Shift">${S.set.shifts.map(s=>`<option value="${s.id}" ${s.id===e.shift?'selected':''}>${esc(s.name)} ${s.start}–${s.end}</option>`).join('')}</select></td>
   <td>${sw('empot',e.id,e.ot)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Tidak ada karyawan.</td></tr>'}</tbody></table></div>${pager(rows.length)}`;
};

V.pengaturan=()=>`<div class="head"><div><h1>Pengaturan</h1><p class="sub">Aturan ini dipakai untuk menghitung status hadir dan lembur.</p></div></div>
  <section class="panel pad" style="display:flex;flex-direction:column;gap:16px"><h2>Jam kerja</h2>
    ${S.set.shifts.map((s,i)=>`<div class="form"><label class="f">Nama shift<input type="text" data-bind="shiftf" data-i="${i}" data-k="name" value="${esc(s.name)}"></label><label class="f">Masuk<input type="time" data-bind="shiftf" data-i="${i}" data-k="start" value="${s.start}"></label><label class="f">Pulang<input type="time" data-bind="shiftf" data-i="${i}" data-k="end" value="${s.end}"></label></div>`).join('')}
    <p class="sub">Jika jam pulang lebih awal dari jam masuk (misalnya 23:00–07:00), shift dianggap melewati tengah malam dan dicatat pada tanggal masuk.</p></section>
  <section class="panel pad" style="display:flex;flex-direction:column;gap:16px"><h2>Aturan</h2>
    <div class="form"><label class="f">Toleransi terlambat (menit)<input type="number" min="0" data-bind="setn" data-k="tol" value="${S.set.tol}"></label><label class="f">Lembur minimal (menit)<input type="number" min="0" step="5" data-bind="setn" data-k="minOT" value="${S.set.minOT}"></label><label class="f">Tarif lembur per jam (Rp)<input type="number" min="0" step="500" data-bind="setn" data-k="rate" value="${S.set.rate||0}"></label></div>
    <label style="display:flex;gap:10px;align-items:center;font-weight:600"><span class="sw"><input type="checkbox" data-bind="sat" ${S.set.sat?'checked':''}><i></i></span>Sabtu termasuk hari kerja</label>
    <p class="sub">Nominal lembur = jam lembur dibayar × tarif per jam, tanpa pengali. Angka ini estimasi untuk dicek lagi oleh bagian penggajian. Jam dibayar dibulatkan ke bawah per 30 menit.</p></section>
  <section class="panel pad" style="display:flex;flex-direction:column;gap:12px"><h2>Hari libur</h2>
    <div class="tools"><input type="date" id="holin"><button class="btn" data-act="addhol">Tambah</button></div>
    <div class="tools">${S.set.holidays.slice().sort().map(h=>`<span class="pill info">${fmtDate(h)} <a href="#pengaturan" data-act="delhol" data-id="${h}" aria-label="Hapus" style="text-decoration:none;margin-left:4px">×</a></span>`).join('')||'<span class="muted">Belum ada.</span>'}</div></section>
  <section class="panel pad" style="display:flex;flex-direction:column;gap:12px"><h2>Data</h2>
    <div class="tools"><button class="btn" data-act="demo">Muat data contoh (224 karyawan)</button>
    <button class="btn bad" data-act="wipe">${ui.confirm?'Klik lagi untuk menghapus semua':'Hapus semua data'}</button></div>
    <p class="sub">Prototipe ini menyimpan data di browser ini saja. Untuk dipakai bersama, data perlu dipindah ke server.</p></section>`;

/* ---------- drawer & modals ---------- */
function drawerHTML(e){
  const days=rangeDays(),o=recap(e,days);
  return `<div class="drawer" role="dialog" aria-label="Detail absensi"><div class="head"><div><h1>${esc(e.name)}</h1><p class="sub">${esc(e.id)} · ${esc(e.dept)} · ${esc(shiftOf(e).name)} ${shiftOf(e).start}–${shiftOf(e).end} · ${e.ot?'berhak lembur':'tidak berhak lembur'}</p></div><button class="btn" data-act="closedrawer">Tutup</button></div>
  <p class="sub">Periode ${fmtDate(ui.from)} sampai ${fmtDate(ui.to)}</p><div class="stats"><div class="stat g"><b>${o.hadir}</b><span>Hadir</span></div><div class="stat w"><b>${o.telat}</b><span>Telat</span></div><div class="stat b"><b>${o.alpa}</b><span>Alpa</span></div><div class="stat"><b>${fmtH(o.otMin)}</b><span>Jam lembur dibayar</span></div><div class="stat"><b style="font-size:20px">${rp(o.amt)}</b><span>Estimasi lembur</span></div></div>
  <div class="scroll panel"><table><thead><tr><th>Tanggal</th><th>Masuk</th><th>Pulang</th><th>Status</th><th class="n">Lembur nyata</th><th>SPL</th><th class="n">Dibayar</th><th class="n">Estimasi</th></tr></thead><tbody>
  ${days.map(ds=>{const i=dayInfo(e,ds),r=i.r;return `<tr class="${i.hol&&!r.in?'off':''}"><td>${fmtDate(ds)}</td><td class="n">${r.in||'—'}</td><td class="n">${r.n>1?r.out+(r.nd?' +1':''):'—'}</td>
   <td><select data-bind="ov" data-ds="${ds}" aria-label="Status ${ds}"><option value="">${i.status}${r.ov?'':' (otomatis)'}</option>${r.ov?'<option value="__auto">Kembali ke otomatis</option>':''}${['Hadir','Izin','Sakit','Cuti','Dinas Luar','Alpa'].filter(x=>x!==r.ov).map(x=>`<option>${x}</option>`).join('')}</select></td>
   <td class="n">${i.ot?fmtH(i.ot)+' j':'—'}</td><td>${i.spl?`<span class="pill good">${i.spl.start}–${i.spl.end}</span><br><span class="muted mono" style="font-size:11px">${esc(i.spl.id)}</span>`:i.flag?`<span class="pill ${i.flag==='Tanpa SPL'?'warn':'bad'}">${i.flag}</span>`:'—'}</td><td class="n">${i.paid?fmtH(i.paid)+' j':'—'}</td><td class="n">${i.paid?rp(i.amt):'—'}</td></tr>`}).join('')}</tbody></table></div></div>`;
}
const layer=()=>$('#layer');
function closeAll(){ui.drawer=null;layer().innerHTML=''}
function modal(html){layer().innerHTML=`<div class="over-ov" data-act="ovclick"><div class="modal" role="dialog">${html}</div></div>`}

  <div class="form"><label class="f">Tanggal lembur<input type="date" id="spl-date" value="${ds}"></label><label class="f">Mulai<input type="time" id="spl-start" value="17:00"></label><label class="f">Selesai<input type="time" id="spl-end" value="20:00"></label></div>

function saveSpl(){
  const date=$('#spl-date').value,st=$('#spl-start').value,en=$('#spl-end').value,reason=$('#spl-reason').value.trim(),err=m=>$('#spl-err').textContent=m;
  if(!date||!st||!en)return err('Isi tanggal dan jam.');
  if(en===st)return err('Jam selesai tidak boleh sama dengan jam mulai. Untuk lembur melewati tengah malam, isi jam selesai di hari berikutnya.');
  if(!reason)return err('Isi pekerjaan atau alasan lembur.');
  if(!pick.sel.size)return err('Pilih minimal satu karyawan.');
  const ids=[...pick.sel],dset=new Set(ids.map(id=>S.emps.find(e=>e.id===id).dept)),mo=date.slice(0,7);
  const n=S.spl.filter(s=>s.date.slice(0,7)===mo).length+1;
  S.spl.push({id:`SPL/${mo.slice(0,4)}/${mo.slice(5)}/${String(n).padStart(3,'0')}`,date,start:st,end:en,reason,dept:dset.size===1?[...dset][0]:'Beberapa departemen',emps:ids,status:'Diajukan'});
  save();closeAll();ui.splTab='Diajukan';render();toast('SPL diajukan');
}

  <div class="letter"><div class="tools" style="justify-content:space-between"><span class="mono">${esc(s.id)}</span><span class="pill ${s.status==='Disetujui'?'good':s.status==='Ditolak'?'bad':'warn'}">${s.status}</span></div>
  <div>Memerintahkan karyawan berikut untuk bekerja lembur pada <b>${fmtDate(s.date)}</b>, pukul <b class="mono">${s.start}–${s.end}</b> (${fmtH(dur(s))} jam)${isHoliday(s.date)?', hari libur':', hari kerja'}.</div>
  <div class="muted">Pekerjaan: ${esc(s.reason)}</div>
  <div>Perkiraan biaya maksimal: <b class="mono">${rp(s.emps.length*dur(s)/60*S.set.rate)}</b> <span class="muted">(${s.emps.length} orang × ${fmtH(dur(s))} jam × ${rp(S.set.rate)})</span></div>
  <div class="scroll"><table><tbody>${emps.map((e,i)=>`<tr><td class="n dim">${i+1}</td><td>${esc(e.name)}</td><td class="mono dim">${esc(e.id)}</td><td class="dim">${esc(e.dept)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="tools" style="justify-content:flex-end"><button class="btn" data-act="copyspl" data-id="${esc(s.id)}">Salin teks SPL</button></div>`);
}
function splText(s){const emps=s.emps.map(i=>S.emps.find(e=>e.id===i)).filter(Boolean);
  return `SURAT PERINTAH LEMBUR\nNo: ${s.id}\nTanggal: ${fmtDate(s.date)}\nJam: ${s.start}-${s.end}\nPekerjaan: ${s.reason}\nStatus: ${s.status}\n\nKaryawan:\n`+emps.map((e,i)=>`${i+1}. ${e.name} (${e.id}) - ${e.dept}`).join('\n')}
function newEmpModal(){
  modal(`<div class="head"><h1>Tambah karyawan</h1><button class="btn" data-act="closemodal">Tutup</button></div>
  <div class="form"><label class="f">ID / PIN fingerprint<input type="text" id="ne-id"></label><label class="f">Nama<input type="text" id="ne-name"></label><label class="f">Departemen<input type="text" id="ne-dept" list="dl"></label><datalist id="dl">${depts().map(d=>`<option value="${esc(d)}">`).join('')}</datalist>
  <label class="f">Shift<select id="ne-shift">${S.set.shifts.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label></div>
  <label style="display:flex;gap:10px;align-items:center;font-weight:600"><span class="sw"><input type="checkbox" id="ne-ot"><i></i></span>Boleh lembur</label>
  <div id="ne-err" style="color:var(--bad)"></div>
  <div class="tools" style="justify-content:flex-end"><button class="btn" data-act="closemodal">Batal</button><button class="btn primary" data-act="saveemp">Simpan</button></div>`);
}
function copyText(t,msg){
  const fb=()=>modal(`<div class="head"><h1>Salin manual</h1><button class="btn" data-act="closemodal">Tutup</button></div><textarea id="cp" rows="10" style="font-family:var(--num);font-size:12px">${esc(t)}</textarea><p class="sub">Pilih semua teks di atas lalu salin.</p>`);
  try{navigator.clipboard.writeText(t).then(()=>toast(msg),fb)}catch(e){fb()}
}

/* ---------- import ---------- */
const DT=/\d{4}[-\/]\d{1,2}[-\/]\d{1,2}|\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4}/,TM=/\d{1,2}:\d{2}/;
function parseDT(s){
  s=String(s).trim();let m=s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/),y,mo,d;
  if(m){y=+m[1];mo=+m[2];d=+m[3]}else{m=s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);if(!m)return null;d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=2000}
  const t=s.match(/(\d{1,2}):(\d{2})/);if(!t||mo<1||mo>12||d<1||d>31)return null;
  return {date:`${y}-${pad(mo)}-${pad(d)}`,time:pad(+t[1])+':'+t[2]};
}
async function readRows(f){
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext==='xlsx'||ext==='xls'){
    if(!window.XLSX)throw new Error('Pustaka Excel belum termuat. Simpan file sebagai CSV lalu unggah lagi.');
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,dateNF:'yyyy-mm-dd hh:mm:ss',defval:''}).filter(r=>r.some(c=>String(c).trim()));
  }
  const lines=(await f.text()).split(/\r?\n/).filter(l=>l.trim()),l0=lines[0]||'';
  const dl=l0.includes('\t')?'\t':l0.includes(';')?';':l0.includes(',')?',':/\s+/;
  return lines.map(l=>l.split(dl).map(x=>x.trim().replace(/^"|"$/g,'')));
}
function guess(rows){
  const first=rows[0]||[],hasHead=first.some(c=>/[a-zA-Z]{3,}/.test(c))&&!first.some(c=>DT.test(c));
  const head=hasHead?first.map(String):null,data=hasHead?rows.slice(1):rows,smp=data.slice(0,30),n=Math.max(...rows.slice(0,30).map(r=>r.length),1);
  const frac=(i,fn)=>smp.length?smp.filter(r=>fn(String(r[i]??''))).length/smp.length:0;
  const map={id:-1,name:-1,dt:-1,tm:-1};
  for(let i=0;i<n;i++){const h=head?String(head[i]).toLowerCase():'';
    if(map.id<0&&/pin|\bid\b|badge|nik|no\.?\s*id|userid/.test(h))map.id=i;
    if(map.name<0&&/nama|name/.test(h))map.name=i;}
  for(let i=0;i<n;i++){if(frac(i,s=>DT.test(s)&&TM.test(s))>.6){map.dt=i;break}}
  if(map.dt<0){for(let i=0;i<n;i++)if(frac(i,s=>DT.test(s))>.6){map.dt=i;break}
    for(let i=0;i<n;i++)if(i!==map.dt&&frac(i,s=>TM.test(s)&&!DT.test(s))>.6){map.tm=i;break}}
  if(map.id<0){for(let i=0;i<n;i++)if(i!==map.dt&&i!==map.tm&&frac(i,s=>/^\d+$/.test(s))>.6){map.id=i;break}}
  if(map.id<0)map.id=0;if(map.dt<0)map.dt=Math.min(1,n-1);
  return {head,data,map,ncol:n};
}
function analyze(){
  const im=ui.imp,m=im.map,groups=new Map(),ids=new Set(),names={};const nightIds=new Set(S.emps.filter(e=>isNight(shiftOf(e))).map(e=>e.id));let valid=0,bad=0,min='',max='';
  im.data.forEach(r=>{
    const id=normId(r[m.id]??'');let s=String(r[m.dt]??'');if(m.tm>=0)s+=' '+(r[m.tm]??'');
    const p=parseDT(s);if(!id||!p){bad++;return}
    valid++;ids.add(id);if(m.name>=0&&r[m.name])names[id]=String(r[m.name]).trim();
    let dt=p.date,t=toMin(p.time);
    if(nightIds.has(id)&&t<720){const x=pd(dt);x.setDate(x.getDate()-1);dt=dstr(x);t+=1440}
    if(!min||dt<min)min=dt;if(!max||dt>max)max=dt;
    const k=id+'|'+dt,g=groups.get(k);
    if(!g)groups.set(k,{a:t,b:t,n:1});else{g.a=Math.min(g.a,t);g.b=Math.max(g.b,t);g.n++}
  });
  const known=new Set(S.emps.map(e=>e.id));
  im.res={valid,bad,ids,groups,names,min,max,unknown:[...ids].filter(i=>!known.has(i)).length};
}
async function handleFile(f){
  try{
    const rows=await readRows(f);if(!rows.length)throw new Error('File kosong.');
    const g=guess(rows);ui.imp={file:f.name,rows,head:g.head,data:g.data,map:g.map,ncol:g.ncol};analyze();
  }catch(e){ui.imp={err:e.message||'File tidak bisa dibaca.'}}
  $('#impbox').innerHTML=impBox();
}
function applyImport(){
  const r=ui.imp.res;let newE=0;
  r.ids.forEach(id=>{if(!S.emps.find(e=>e.id===id)){S.emps.push({id,name:r.names[id]||'Karyawan '+id,dept:'Belum diatur',shift:S.set.shifts[0].id,ot:false});newE++}});
  r.groups.forEach((g,k)=>{const old=S.att[k]||{};S.att[k]={...old,in:fromMin(g.a%1440),out:fromMin(g.b%1440),n:g.n};if(g.b>=1440)S.att[k].nd=1;else delete S.att[k].nd});
  (S.imports=S.imports||[]).unshift({file:ui.imp.file,at:new Date().toLocaleString('id-ID'),rows:r.valid,days:r.groups.size,newEmps:newE});
  ui.month=r.max.slice(0,7);ui.day=r.max;ui.from=r.max.slice(0,7)+'-01';ui.to=r.max;S.emps.sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
  save();ui.imp=null;render();toast(`Impor selesai: ${r.groups.size} hari-orang`);
}

/* ---------- render ---------- */
function render(){
  $('#nav').innerHTML=VIEWS.map(([k,l])=>`<a href="#${k}" ${ui.view===k?'aria-current="page"':''}>${l}${k==='lembur'&&pendingN()?`<span class="badge">${pendingN()}</span>`:''}</a>`).join('');
  $('#main').innerHTML=(S.demo?'<div class="banner">Menampilkan data contoh. Hapus di Pengaturan sebelum mengimpor data asli.</div>':'')+V[ui.view]();
  const d=ui.drawer&&S.emps.find(e=>e.id===ui.drawer);if(d){layer().innerHTML=`<div class="over-ov" data-act="ovclick" style="padding:0;justify-content:flex-end">${drawerHTML(d)}</div>`}
  if(ui.view==='impor')wireDrop();
}
function refresh(){const l=$('#list');if(l)l.innerHTML=LST[ui.view]()}
function setView(){const h=location.hash.slice(1);ui.view=V[h]?h:'ringkasan';ui.page=0;ui.q='';ui.dept='';ui.confirm=false;closeAll();render();window.scrollTo(0,0)}
function wireDrop(){
  const dz=$('#drop'),fi=$('#file');
  fi.onchange=()=>fi.files[0]&&handleFile(fi.files[0]);
  ['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over')}));
  dz.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)handleFile(f)});
}

/* ---------- events ---------- */
const ACT={
  prev(){ui.page--;refresh()},next(){ui.page++;refresh()},
  open(a){ui.drawer=a.dataset.id;render()},closedrawer(){closeAll()},closemodal(){layer().innerHTML=''},
  ovclick(a,e){if(e.target===a){ui.drawer?closeAll():layer().innerHTML=''}},
  dayprev(){const d=pd(ui.day);d.setDate(d.getDate()-1);ui.day=dstr(d);render()},
  daynext(){const d=pd(ui.day);d.setDate(d.getDate()+1);ui.day=dstr(d);render()},
  approve(a){const s=S.spl.find(x=>x.id===a.dataset.id);s.status='Disetujui';save();render();toast('SPL disetujui')},
  reject(a){const s=S.spl.find(x=>x.id===a.dataset.id);s.status='Ditolak';save();render();toast('SPL ditolak')},
  spltab(a){ui.splTab=a.dataset.id;render()},
  newspl(){newSplModal()},savespl(){saveSpl()},viewspl(a){viewSpl(a.dataset.id)},
  copyspl(a){copyText(splText(S.spl.find(x=>x.id===a.dataset.id)),'Teks SPL tersalin')},
  pickall(){document.querySelectorAll('#picklist input').forEach(i=>{pick.sel.add(i.dataset.id);i.checked=true});$('#spl-count').textContent=pick.sel.size+' dipilih'},
  newemp(){newEmpModal()},
  saveemp(){const id=normId($('#ne-id').value),name=$('#ne-name').value.trim(),err=m=>$('#ne-err').textContent=m;
    if(!id||!name)return err('ID dan nama wajib diisi.');if(S.emps.some(e=>e.id===id))return err('ID sudah dipakai.');
    S.emps.push({id,name,dept:$('#ne-dept').value.trim()||'Belum diatur',shift:$('#ne-shift').value,ot:$('#ne-ot').checked});save();layer().innerHTML='';render();toast('Karyawan ditambahkan')},
  applyimp(){applyImport()},cancelimp(){ui.imp=null;$('#impbox').innerHTML=''},
  copyrekap(){const rows=S.emps.filter(matchQ),h=['ID','Nama','Departemen','Hadir','Telat','Izin/Sakit/Cuti','Alpa','Tidak lengkap','Lembur (jam)','Estimasi lembur (Rp)'];
    copyText([h.join('\t'),...rows.map(e=>{const o=recap(e,rangeDays());return [e.id,e.name,e.dept,o.hadir,o.telat,o.izin,o.alpa,o.inc,fmtH(o.otMin),Math.round(o.amt)].join('\t')})].join('\n'),'Tersalin, tempel di Excel')},
  addhol(){const v=$('#holin').value;if(v&&!S.set.holidays.includes(v)){S.set.holidays.push(v);save();render()}},
  delhol(a,e){e.preventDefault();S.set.holidays=S.set.holidays.filter(h=>h!==a.dataset.id);save();render()},
  demo(){S=demo();save();Object.assign(ui,{month:latest().slice(0,7),day:latest(),from:latest().slice(0,7)+'-01',to:latest()});render();toast('Data contoh dimuat')},
  wipe(){if(!ui.confirm){ui.confirm=true;render();return}S={demo:false,emps:[],att:{},spl:[],set:DEFAULT_SET(),imports:[]};ui.confirm=false;save();render();toast('Semua data dihapus')}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;
  if(e.target.closest('select,input,label.sw')&&a.dataset.act==='open')return;
  const f=ACT[a.dataset.act];if(f)f(a,e)});
function onBind(e){
  const t=e.target,b=t.dataset.bind;if(!b)return;
  const live=e.type==='input';
  if(live&&!['q','splq'].includes(b))return;
  if(!live&&['q','splq'].includes(b))return;
  switch(b){
    case 'q':ui.q=t.value;ui.page=0;refresh();break;
    case 'dept':ui.dept=t.value;ui.page=0;refresh();break;
    case 'from':if(t.value){ui.from=t.value;if(ui.to<ui.from)ui.to=ui.from;ui.page=0;render()}break;
    case 'to':if(t.value){ui.to=t.value;if(ui.from>ui.to)ui.from=ui.to;ui.page=0;render()}break;
    case 'preset':{const L=latest(),d=pd(L);let f,end=L;
      if(t.value==='cur')f=L.slice(0,7)+'-01';
      else if(t.value==='prev'){f=dstr(new Date(d.getFullYear(),d.getMonth()-1,1));end=dstr(new Date(d.getFullYear(),d.getMonth(),0))}
      else if(t.value){const a=new Date(d);a.setDate(a.getDate()-(+t.value-1));f=dstr(a)}
      if(f){ui.from=f;ui.to=end;ui.page=0;render()}break}
    case 'month':ui.month=t.value;ui.page=0;render();break;
    case 'day':if(t.value){ui.day=t.value;render()}break;
    case 'empot':{const em=S.emps.find(x=>x.id===t.dataset.id);em.ot=t.checked;save();$('#main').querySelector('.pager span').textContent=S.emps.length+' karyawan · '+S.emps.filter(x=>x.ot).length+' berhak lembur';break}
    case 'empshift':S.emps.find(x=>x.id===t.dataset.id).shift=t.value;save();break;
    case 'shiftf':S.set.shifts[+t.dataset.i][t.dataset.k]=t.value;save();break;
    case 'setn':S.set[t.dataset.k]=Math.max(0,+t.value||0);save();break;
    case 'sat':S.set.sat=t.checked;save();break;
    case 'map':ui.imp.map[t.dataset.k]=+t.value;analyze();$('#impbox').innerHTML=impBox();break;
    case 'ov':{const em=S.emps.find(x=>x.id===ui.drawer),k=em.id+'|'+t.dataset.ds,r=S.att[k]||(S.att[k]={});
      if(t.value===''||t.value==='__auto'){if(t.value==='__auto')delete r.ov}else r.ov=t.value;
      if(!Object.keys(r).length)delete S.att[k];save();render();break}
    case 'pick':t.checked?pick.sel.add(t.dataset.id):pick.sel.delete(t.dataset.id);$('#spl-count').textContent=pick.sel.size+' dipilih';break;
    case 'spldept':$('#picklist').innerHTML=pickList();break;
    case 'splq':pick.q=t.value;$('#picklist').innerHTML=pickList();break;
  }
}
document.addEventListener('input',onBind);document.addEventListener('change',onBind);
window.addEventListener('hashchange',setView);
setView();
</script>
