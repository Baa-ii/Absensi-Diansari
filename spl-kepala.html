<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPL Kepala Produksi · Absensi Karyawan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>.card{max-width:380px;margin:8vh auto 0}.card form{display:flex;flex-direction:column;gap:14px;padding:22px}.err{color:var(--bad);min-height:1.2em}main.k{max-width:780px;margin:16px auto 0}</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="bar1" style="grid-template-columns:1fr auto"><div class="brand"><span class="mark">A</span>SPL Kepala Produksi</div><div class="utools"><span class="user" id="who" hidden></span><button class="btn" id="out" hidden>Keluar</button></div></div></header>
<main class="k" id="main"><div class="panel empty">Memuat&hellip;</div></main>
</div>
<div id="toast" class="toast" hidden></div>
<script src="assets/firebase-config.js"></script>
<script src="assets/cloud.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const D0=new Date(),TODAY=D0.getFullYear()+'-'+pad(D0.getMonth()+1)+'-'+pad(D0.getDate());
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fmtD=s=>{const p=s.split('-');return +p[2]+' '+BLN[+p[1]-1]+' '+p[0]};
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
const main=$('#main');
let me=null,E={list:[],names:{}},sel=new Set(),mine=[],busy=false;

function setHead(){
  $('#who').hidden=!me;$('#out').hidden=!me;
  if(me)$('#who').textContent=(E.names&&E.names[me.username])||Cloud.cap(me.username);
}
$('#out').onclick=async()=>{try{await Cloud.logout()}catch(e){}me=null;sel=new Set();setHead();loginView()};

function loginView(msg){
  setHead();
  main.innerHTML=`<section class="panel card"><form id="lf"><div><h1 style="margin:0;font-size:19px">Masuk</h1><p class="sub">Gunakan nama pengguna dan sandi dari admin.</p></div>
  <label class="f">Nama pengguna<input type="text" id="u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
  <label class="f">Sandi<input type="password" id="p" autocomplete="current-password"></label>
  <div class="err" id="e">${esc(msg||'')}</div><button class="btn primary" id="go" type="submit">Masuk</button></form></section>`;
  $('#lf').onsubmit=async ev=>{ev.preventDefault();const u=$('#u').value.trim(),p=$('#p').value;
    if(!u||!p){$('#e').textContent='Isi nama pengguna dan sandi.';return}
    $('#go').disabled=true;$('#e').textContent='';
    try{me=await Cloud.login(u,p);await home()}catch(e){$('#go').disabled=false;$('#e').textContent=e.message}};
}

async function home(){
  main.innerHTML='<div class="panel empty">Memuat data&hellip;</div>';
  try{const r=await Promise.all([Cloud.employees(),Cloud.mySpl()]);E=r[0]||{list:[],names:{}};mine=r[1]}
  catch(e){main.innerHTML=`<div class="panel pad" style="color:var(--bad)">${esc(e.message)}</div><div><button class="btn" id="re">Coba lagi</button></div>`;$('#re').onclick=home;return}
  setHead();view();
}

function depts(){return [...new Set(E.list.map(e=>e.dept||'Belum diatur'))].sort()}
function pickHTML(){
  const dp=($('#dp')||{}).value||'',q=(($('#q')||{}).value||'').toLowerCase();
  const rows=E.list.filter(e=>(!dp||(e.dept||'Belum diatur')===dp)&&(!q||(e.name+' '+e.id).toLowerCase().includes(q))).slice(0,150);
  return rows.map(e=>`<label><input type="checkbox" data-id="${esc(e.id)}" ${sel.has(e.id)?'checked':''}><span><b>${esc(e.name)}</b> <span class="muted">${esc(e.id)} · ${esc(e.dept||'Belum diatur')}${e.pos?' · '+esc(e.pos):''}</span></span></label>`).join('')||'<div class="empty">Tidak ada karyawan yang cocok.</div>';
}
function view(){
  if(!E.list.length){main.innerHTML='<div class="panel empty">Daftar karyawan belum tersedia. Hubungi admin absensi untuk mengirim daftar karyawan.</div>';return}
  main.innerHTML=`<section class="panel pad" style="display:flex;flex-direction:column;gap:16px"><div><h1 style="margin:0;font-size:19px">Buat SPL</h1><p class="sub">SPL langsung diterima bagian absensi. Jika ada yang salah, hubungi admin untuk memperbaiki.</p></div>
  <div class="form"><label class="f">Tanggal shift dimulai<input type="date" id="d" value="${TODAY}"></label><label class="f">Mulai<input type="time" id="s" value="17:00"></label><label class="f">Selesai<input type="time" id="en" value="20:00"></label></div>
  <p class="sub" style="margin-top:-8px">Untuk lembur yang melewati tengah malam, isi jam selesai hari berikutnya dan tanggal shift dimulai.</p>
  <label class="f">Pekerjaan / alasan<textarea id="r" rows="2" maxlength="300" placeholder="Contoh: mengejar target produksi"></textarea></label>
  <label class="f">Keterangan (opsional)<input type="text" id="n" maxlength="200" placeholder="Contoh: SPL kertas no. 123"></label>
  <div><div class="tools" style="margin-bottom:8px"><strong>Karyawan</strong><span class="muted" id="cnt">0 dipilih</span><select id="dp"><option value="">Semua departemen</option>${depts().map(d=>`<option>${esc(d)}</option>`).join('')}</select><input type="text" id="q" placeholder="Cari nama atau ID"><button class="btn sm" id="all" type="button">Pilih semua yang tampil</button><button class="btn sm" id="none" type="button">Kosongkan</button></div>
  <div class="pick" id="pl">${pickHTML()}</div></div>
  <div class="err" id="er"></div><div><button class="btn primary" id="send">Kirim SPL</button></div></section>
  <section class="panel"><div class="ph"><h2>SPL yang saya buat</h2><span class="muted">${mine.length}</span></div>${mineHTML()}</section>`;
  const upd=()=>{$('#cnt').textContent=sel.size+' dipilih'};
  $('#pl').onchange=e=>{const id=e.target.dataset.id;if(!id)return;e.target.checked?sel.add(id):sel.delete(id);upd()};
  const re=()=>{$('#pl').innerHTML=pickHTML()};
  $('#dp').onchange=re;$('#q').oninput=re;
  $('#all').onclick=()=>{document.querySelectorAll('#pl input').forEach(i=>{sel.add(i.dataset.id);i.checked=true});upd()};
  $('#none').onclick=()=>{sel=new Set();re();upd()};
  $('#send').onclick=send;upd();
}
function mineHTML(){
  if(!mine.length)return '<div class="empty">Belum ada SPL.</div>';
  return `<div class="scroll"><table><thead><tr><th>Tanggal</th><th>Jam</th><th>Departemen</th><th class="n">Orang</th><th>Pekerjaan</th><th>Status</th></tr></thead><tbody>${mine.map(s=>`<tr><td>${fmtD(s.date)}</td><td class="n">${esc(s.start)}–${esc(s.end)}</td><td>${esc(s.dept||'')}</td><td class="n">${(s.emps||[]).length}</td><td>${esc(s.reason)}</td><td><span class="pill ${s.imported?'good':'warn'}">${s.imported?'Sudah masuk absensi':'Menunggu admin'}</span></td></tr>`).join('')}</tbody></table></div>`;
}
async function send(){
  if(busy)return;
  const date=$('#d').value,st=$('#s').value,en=$('#en').value,reason=$('#r').value.trim(),err=m=>$('#er').textContent=m;
  if(!date||!st||!en)return err('Isi tanggal dan jam.');
  if(st===en)return err('Jam selesai tidak boleh sama dengan jam mulai.');
  if(!reason)return err('Isi pekerjaan atau alasan lembur.');
  if(!sel.size)return err('Pilih minimal satu karyawan.');
  err('');busy=true;$('#send').disabled=true;
  const ids=[...sel],ds=new Set(ids.map(id=>{const e=E.list.find(x=>x.id===id);return e?(e.dept||'Belum diatur'):'-'}));
  try{
    await Cloud.addSpl({date,start:st,end:en,reason,note:$('#n').value.trim(),dept:ds.size===1?[...ds][0]:'Beberapa departemen',emps:ids,by:(E.names&&E.names[me.username])||Cloud.cap(me.username)});
    sel=new Set();mine=await Cloud.mySpl();view();toast('SPL terkirim');window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  }catch(e){err(e.message);$('#send').disabled=false}
  busy=false;
}
(async()=>{
  try{me=await Cloud.ready()}catch(e){main.innerHTML=`<div class="panel pad" style="color:var(--bad)">Tidak bisa terhubung ke layanan SPL. ${esc(e.message)}</div>`;return}
  me?home():loginView();
})();
</script>
</body>
</html>
