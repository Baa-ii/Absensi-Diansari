<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Rekap dan Tarikan · Absensi Karyawan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap" id="app"></div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>
<script src="assets/data.js"></script>
<script src="assets/layout.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/cloud.js"></script>
<script src="assets/sync.js"></script>
<script>if(typeof boot==='undefined'||typeof S==='undefined'){document.body.innerHTML='<p style="padding:24px;font:16px system-ui,sans-serif">File aplikasi belum lengkap. Unggah folder assets (style.css, data.js, layout.js) bersama semua halaman ke GitHub.</p>'}</script>
<script>
const NEED={data:'1.1',layout:'1.1'};
V.rekap=()=>tb('Rekap & tarikan',rangeCtl(),'Pilih rentang tanggal untuk menarik data gaji mingguan, 2 mingguan atau bulanan. Nominal lembur adalah estimasi untuk dicek bagian penggajian.')+
  `<section class="panel"><div class="tools" style="padding:12px 14px;border-bottom:1px solid var(--line)"><select data-bind="pay" id="paysel">${payOpts(ui.pay)}</select><select data-bind="dept" id="deptsel">${deptOpts(ui.dept)}</select><input type="text" id="q" data-bind="q" placeholder="Cari nama, ID, jabatan" value="${esc(ui.q)}"><span style="flex:1"></span><button class="btn" data-act="copyrekap">Salin untuk Excel</button></div><div id="list">${LST.rekap()}</div></section>`;
LST.rekap=()=>{
  const RD=rangeDays();
  const rows=S.emps.filter(matchQ).map(e=>({e,o:recap(e,RD)})).filter(({e,o})=>!e.off||o.hadir+o.izin+o.inc>0);
  const tot=rows.reduce((a,r)=>a+r.o.otMin,0),amt=rows.reduce((a,r)=>a+r.o.amt,0),sl=rows.slice(ui.page*PS,(ui.page+1)*PS);
  return `<div class="pager top"><span>${fmtDate(ui.from)} sampai ${fmtDate(ui.to)} (${RD.length} hari) · ${rows.length} karyawan · lembur dibayar <b class="num">${fmtH(tot)}</b> jam · estimasi <b class="num">${rp(amt)}</b></span></div>
  <div class="scroll"><table><thead><tr><th>Karyawan</th><th>Gaji</th><th class="n">Hadir</th><th class="n">Telat</th><th class="n">Izin/Sakit/Cuti</th><th class="n">Alpa</th><th class="n">Tdk lengkap</th><th class="n">Lembur (jam)</th><th class="n">Estimasi lembur</th></tr></thead>
  <tbody>${sl.map(({e,o})=>`<tr class="click" data-act="open" data-id="${esc(e.id)}"><td><b>${esc(e.name)}</b>${e.off?' <span class="pill">nonaktif</span>':''}${o.un?` <span class="pill warn" title="Shift hari-hari ini perlu dicek">${o.un} shift perlu cek</span>`:''}<br><span class="muted">${esc(e.id)} · ${esc(e.dept)}${e.pos?' · '+esc(e.pos):''}</span></td><td><span class="pill">${esc(e.pay)}</span></td>
    <td class="n">${o.hadir}</td><td class="n ${o.telat?'':'dim'}">${o.telat}</td><td class="n ${o.izin?'':'dim'}">${o.izin}</td>
    <td class="n" style="${o.alpa?'color:var(--bad)':'color:var(--muted)'}">${o.alpa}${o.noscan?` <span class="muted" title="Hari tanpa scan karyawan bergilir (jadwal belum diketahui)">+${o.noscan}</span>`:''}</td><td class="n ${o.inc?'':'dim'}">${o.inc}</td>
    <td class="n">${o.otMin?fmtH(o.otMin):'<span class="muted">0</span>'}${o.noSpl?` <span class="pill warn" title="Lembur tanpa SPL">${o.noSpl} tanpa SPL</span>`:''}</td><td class="n ${o.amt?'':'dim'}">${o.amt?rp(o.amt):'0'}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">Tidak ada data.</td></tr>'}</tbody></table></div>${pager(rows.length)}`;
};
ACT.copyrekap=()=>{const RD=rangeDays(),rows=S.emps.filter(matchQ).map(e=>({e,o:recap(e,RD)})).filter(({e,o})=>!e.off||o.hadir+o.izin+o.inc>0);
  const h=['ID','Nama','Departemen','Jabatan','Kelompok gaji','Tarif/jam','Hadir','Telat','Izin/Sakit/Cuti','Alpa','Tanpa scan','Tidak lengkap','Lembur (jam)','Estimasi lembur (Rp)'];
  copyText([`Periode\t${ui.from}\t${ui.to}`,h.join('\t'),...rows.map(({e,o})=>[e.id,e.name,e.dept,e.pos,e.pay,rateOf(e),o.hadir,o.telat,o.izin,o.alpa,o.noscan,o.inc,fmtH(o.otMin),Math.round(o.amt)].join('\t'))].join('\n'),'Tersalin, tempel di Excel')};
boot({view:'rekap',need:NEED});

</script>
</body>
</html>
