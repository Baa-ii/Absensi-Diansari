<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Rekap dan Tarikan · Absensi Karyawan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>
<script src="assets/data.js"></script>
<script src="assets/layout.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/cloud.js"></script>
<script src="assets/idle.js"></script>
<script src="assets/sync.js"></script>
<script>if(typeof boot==='undefined'||typeof S==='undefined'){document.body.innerHTML='<p style="padding:24px;font:16px system-ui,sans-serif">File aplikasi belum lengkap. Unggah folder assets (style.css, data.js, layout.js) bersama semua halaman ke GitHub.</p>'}</script>
<script>
const NEED={data:'1.1',layout:'1.1'};
V.rekap=()=>tb('Rekap & tarikan',rangeCtl(),'Pilih rentang tanggal untuk menarik data gaji mingguan, 2 mingguan atau bulanan. Nominal lembur adalah estimasi untuk dicek bagian penggajian.')+
  `<section class="panel"><div class="tools" style="padding:12px 14px;border-bottom:1px solid var(--line)"><select data-bind="pay" id="paysel" style="max-width:150px">${payOpts(ui.pay)}</select><select data-bind="dept" id="deptsel" style="max-width:150px">${deptOpts(ui.dept)}</select><select data-bind="vend" id="vendsel" style="max-width:150px">${vendOpts(ui.vend)}</select><input type="text" id="q" data-bind="q" style="width:170px" placeholder="Cari nama, ID, jabatan" value="${esc(ui.q)}"><span style="flex:1"></span><button class="btn primary" data-act="xlsrekap">Tarik ke Excel</button><button class="btn" data-act="copyrekap">Salin</button><button class="btn bad" data-act="delrange">Hapus absensi…</button></div><div id="list">${LST.rekap()}</div></section>`;
LST.rekap=()=>{
  const RD=rangeDays();
  const rows=S.emps.filter(matchQ).map(e=>({e,o:recap(e,RD)})).filter(({e,o})=>!e.off||o.hadir+o.izin+o.inc>0);
  const tot=rows.reduce((a,r)=>a+r.o.otMin,0),amt=rows.reduce((a,r)=>a+r.o.amt,0),sl=rows.slice(ui.page*PS,(ui.page+1)*PS);
  return `<div class="pager top"><span>${fmtDate(ui.from)} sampai ${fmtDate(ui.to)} (${RD.length} hari) · ${rows.length} karyawan · lembur dibayar <b class="num">${fmtH(tot)}</b> jam · estimasi <b class="num">${rp(amt)}</b> · tunjangan shift <b class="num">${rp(rows.reduce((a,r)=>a+r.o.tj,0))}</b> · potongan <b class="num">${rp(rows.reduce((a,r)=>a+r.o.pot,0))}</b></span>${(()=>{const n=noScanList(RD,matchQ).length;return n?`<button class="btn sm" data-act="nsreview">${n} hari tanpa scan perlu dikonfirmasi: Tinjau</button>`:''})()}</div>
  <div class="scroll"><table><thead><tr><th>Karyawan</th><th class="n">Hadir</th><th class="n">Telat</th><th class="n">Izin/Sakit/Cuti</th><th class="n">Alpa</th><th class="n">Tdk lengkap</th><th class="n">Lembur (jam)</th><th class="n">Estimasi lembur</th><th class="n">Tunj. shift</th><th class="n">Potongan</th></tr></thead>
  <tbody>${sl.map(({e,o})=>`<tr class="click" data-act="open" data-id="${esc(e.id)}"><td><b>${esc(e.name)}</b>${e.off?' <span class="pill">nonaktif</span>':''}${e.os?` <span class="pill info">${esc(e.os)}</span>`:''}${o.un?` <span class="pill warn" title="Shift hari-hari ini perlu dicek">${o.un} shift perlu cek</span>`:''}<br><span class="muted">${esc(e.id)} · ${esc(e.dept)}${e.pos?' · '+esc(e.pos):''}</span></td>
    <td class="n">${o.hadir}</td><td class="n ${o.telat?'':'dim'}">${o.telat}</td><td class="n ${o.izin?'':'dim'}">${o.izin}</td>
    <td class="n" style="${o.alpa?'color:var(--bad)':'color:var(--muted)'}">${o.alpa}${o.noscan?` <span class="muted" title="Hari tanpa scan karyawan bergilir (jadwal belum diketahui)">+${o.noscan}</span>`:''}</td><td class="n ${o.inc?'':'dim'}">${o.inc}</td>
    <td class="n">${o.otMin?fmtH(o.otMin):'<span class="muted">0</span>'}${o.noSpl?` <span class="pill warn" title="Lembur tanpa SPL">${o.noSpl} tanpa SPL</span>`:''}</td><td class="n ${o.amt?'':'dim'}">${o.amt?rp(o.amt):'0'}</td><td class="n ${o.tj?'':'dim'}" title="Tunjangan shift per hari masuk (dari menu Shift)">${o.tj?rp(o.tj):'0'}</td><td class="n ${o.pot?'':'dim'}" title="Potongan hari Alpa (tidak ada scan)">${o.pot?rp(o.pot):'0'}</td></tr>`).join('')||'<tr><td colspan="10" class="empty">Tidak ada data.</td></tr>'}</tbody></table></div>${pager(rows.length)}`;
};
const hcount=()=>{const f=ui.hf,t=ui.ht;let n=0;const s=new Set();Object.keys(S.att).forEach(k=>{const[i,d]=k.split('|');if(d>=f&&d<=t){n++;s.add(i)}});return[n,s.size]};
const hshow=()=>{const[n,e]=hcount(),el=$('#hcnt');if(el)el.innerHTML=`<b>${n}</b> catatan absensi dari <b>${e}</b> karyawan akan dihapus.`;ui.hn=n;const b=$('#del-go');if(b)b.disabled=!(n>0&&$('#dz-conf').value.trim()==='HAPUS')};
ACT.delrange=()=>{ui.hf=ui.from;ui.ht=ui.to;
  modal(`<div class="tb" style="padding:0"><h1>Hapus absensi per tanggal</h1></div><p style="color:var(--muted);font-size:14px">Menghapus jam scan, status manual dan catatan absensi pada rentang tanggal. Data karyawan dan SPL tidak ikut terhapus.</p>
  <div class="tools"><label class="f">Dari<input type="date" value="${ui.hf}" data-bind="hf"></label><label class="f">Sampai<input type="date" value="${ui.ht}" data-bind="ht"></label></div>
  <p id="hcnt" style="font-size:14px"></p>
  <label class="f">Ketik HAPUS untuk melanjutkan<input type="text" id="dz-conf" data-bind="delconf" autocomplete="off"></label>
  <div class="tools" style="justify-content:flex-end"><button class="btn" data-act="closemodal">Batal</button><button class="btn bad" id="del-go" data-act="delrangego" disabled>Hapus absensi</button></div>`);hshow()};
BIND.hf=t=>{ui.hf=t.value;hshow()};BIND.ht=t=>{ui.ht=t.value;hshow()};BIND.delconf=()=>hshow();
ACT.delrangego=()=>{const f=ui.hf,t=ui.ht;let n=0;Object.keys(S.att).forEach(k=>{const d=k.split('|')[1];if(d>=f&&d<=t){delete S.att[k];n++}});save();layer().innerHTML='';render();toast(`${n} catatan absensi dihapus`)};
const HR=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const rekapData=()=>{const RD=rangeDays(),rows=S.emps.filter(matchQ).map(e=>({e,o:recap(e,RD)})).filter(({e,o})=>!e.off||o.hadir+o.izin+o.inc>0);
  const h=['ID','Nama','Departemen','Jabatan','Penyedia','Tarif/jam (Rp)','Hadir','Telat','Izin/Sakit/Cuti','Alpa','Tanpa scan','Tidak lengkap','Lembur (jam)','Estimasi lembur (Rp)','Tunjangan shift (Rp)','Potongan (Rp)','Total: lembur + tunjangan - potongan (Rp)'];
  const body=rows.map(({e,o})=>[e.id,e.name,e.dept,e.pos,e.os||'Karyawan sendiri',rateOf(e),o.hadir,o.telat,o.izin,o.alpa,o.noscan,o.inc,Math.round(o.otMin/60*100)/100,Math.round(o.amt),Math.round(o.tj),Math.round(o.pot),Math.round(o.amt+o.tj-o.pot)]);
  const sum=i=>body.reduce((a,r)=>a+(+r[i]||0),0);
  const A=[['Periode',ui.from,ui.to],h,...body,[],['Total','','','','','',sum(6),sum(7),sum(8),sum(9),sum(10),sum(11),Math.round(sum(12)*100)/100,sum(13),sum(14),sum(15),sum(16)]];
  const dh=['Nama','ID','Departemen','Penyedia','Tanggal','Hari','Status','Shift','Masuk','Pulang','Telat (menit)','Lembur dibayar (jam)','Estimasi lembur (Rp)','Tunjangan shift (Rp)','Potongan (Rp)','Keterangan'];
  const Dl=[dh];rows.forEach(({e})=>RD.forEach(ds=>{const i=dayInfo(e,ds),r=i.r;if(i.status==='—'||(i.status==='Libur'&&!r.in))return;
    const ket=i.status==='Tanpa scan'?'Belum dikonfirmasi (cek: libur, izin, atau alpa)':i.status==='Tidak lengkap'?'Scan hanya sekali (lupa scan masuk atau pulang)':r.ov?'Status diatur manual':'';
    Dl.push([e.name,e.id,e.dept,e.os||'Karyawan sendiri',ds,HR[pd(ds).getDay()],i.status+(r.ov?' (manual)':''),i.sh.name,r.in||'',r.out&&r.n>1?r.out:'',i.late||'',Math.round(i.paid/60*100)/100,Math.round(i.amt),i.tj,i.pot,ket])}));
  return {A,Dl}};
ACT.xlsrekap=()=>{const {A,Dl}=rekapData();
  if(!window.XLSX){copyText(A.map(r=>r.join('\t')).join('\n'),'Pustaka Excel belum termuat, data disalin: tempel di Excel');return}
  const ws=XLSX.utils.aoa_to_sheet(A);ws['!cols']=[{wch:8},{wch:28},{wch:18},{wch:18},{wch:18},{wch:13},{wch:7},{wch:7},{wch:14},{wch:6},{wch:11},{wch:13},{wch:13},{wch:19},{wch:19},{wch:15},{wch:30}];
  const fmt=(w,cols,r0)=>{const rg=XLSX.utils.decode_range(w['!ref']);for(let r=r0;r<=rg.e.r;r++)cols.forEach(c=>{const x=w[XLSX.utils.encode_cell({r,c})];if(x&&x.t==='n')x.z='#,##0'})};
  fmt(ws,[5,13,14,15,16],2);
  const w2=XLSX.utils.aoa_to_sheet(Dl);w2['!cols']=[{wch:28},{wch:8},{wch:18},{wch:18},{wch:12},{wch:6},{wch:18},{wch:14},{wch:8},{wch:8},{wch:12},{wch:18},{wch:19},{wch:19},{wch:14},{wch:44}];fmt(w2,[12,13,14],1);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Rekap');XLSX.utils.book_append_sheet(wb,w2,'Rincian harian');
  try{XLSX.writeFile(wb,'rekap-absensi-'+ui.from+'_sd_'+ui.to+'.xlsx');toast('File Excel dibuat (2 lembar: Rekap dan Rincian harian)')}catch(e){copyText(A.map(r=>r.join('\t')).join('\n'),'Tersalin, tempel di Excel')}};
ACT.copyrekap=()=>{const {A}=rekapData();copyText(A.map(r=>r.join('\t')).join('\n'),'Tersalin, tempel di Excel')};
function nsModal(){const L=noScanList(rangeDays(),matchQ),sh=L.slice(0,200);
  modal(`<div class="tb" style="padding:0"><h1>Konfirmasi hari tanpa scan</h1><button class="btn" data-act="closemodal">Tutup</button></div>
  <p class="sub">Karyawan bergilir yang tidak ada scan pada hari kerja. Pilih <b>Alpa</b> (dipotong ${rp(S.set.pot||0)}), atau <b>Libur</b> / <b>Izin</b> (tidak dipotong). Daftar mengikuti rentang tanggal dan filter di halaman Rekap.</p>
  ${L.length?`<div class="tools" style="margin-bottom:8px"><button class="btn sm bad" data-act="nsall" data-v="Alpa">${ui.nsx==='Alpa'?'Yakin? Semua jadi Alpa':'Semua jadi Alpa ('+L.length+')'}</button><button class="btn sm" data-act="nsall" data-v="Libur">${ui.nsx==='Libur'?'Yakin? Semua jadi Libur':'Semua jadi Libur'}</button></div>`:''}
  <div style="max-height:50vh;overflow:auto">${sh.map(x=>`<div class="item"><div class="t"><b>${esc(x.e.name)}</b><span>${fmtDate(x.ds)}${x.e.os?' · '+esc(x.e.os):''}</span></div><span class="tools"><button class="btn sm bad" data-act="nsset" data-id="${esc(x.e.id)}" data-ds="${x.ds}" data-v="Alpa">Alpa</button><button class="btn sm" data-act="nsset" data-id="${esc(x.e.id)}" data-ds="${x.ds}" data-v="Libur">Libur</button><button class="btn sm" data-act="nsset" data-id="${esc(x.e.id)}" data-ds="${x.ds}" data-v="Izin">Izin</button></span></div>`).join('')||'<div class="empty">Semua hari sudah terkonfirmasi.</div>'}</div>${L.length>200?'<p class="sub">Menampilkan 200 pertama. Konfirmasi dulu, lalu buka lagi untuk sisanya.</p>':''}`)}
const nsApply=(id,ds,v)=>{const k=id+'|'+ds;S.att[k]=Object.assign({},S.att[k]||{},{ov:v})};
ACT.nsreview=()=>{ui.nsx=null;nsModal()};
ACT.nsset=a=>{nsApply(a.dataset.id,a.dataset.ds,a.dataset.v);save();render();nsModal()};
ACT.nsall=a=>{const v=a.dataset.v;if(ui.nsx!==v){ui.nsx=v;nsModal();return}ui.nsx=null;const L=noScanList(rangeDays(),matchQ);L.forEach(x=>nsApply(x.e.id,x.ds,v));save();render();nsModal();toast(L.length+' hari dikonfirmasi sebagai '+v)};
boot({view:'rekap',need:NEED});

</script>
</body>
</html>
